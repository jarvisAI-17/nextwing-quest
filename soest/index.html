<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Das Geheimnis der Dicken Gertrud</title>
<meta name="description" content="Ein Kirmes-Rätselspiel für Hannelore, Markus und Stefan. Allerheiligenkirmes Soest. Jeder spielt am eigenen Handy.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&family=Shrikhand&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: Allerheiligenkirmes Soest bei Nacht. Nextwing-Kopfzeile bleibt; oben das Kirmes-Panorama (Soester Kirchtürme, Riesenrad, Feuerwerk) als Canvas, darunter Anzeigetafel mit Glühbirnen-Rahmen (Dashboard), Geschichten auf einem Kirmesplakat, Rätsel in einer Bude mit gestreifter Markise. Nur dunkel: es ist Kirmesabend. */
:root{--surface:#0b1220;--ink:#eef2fb;--muted:#a8b0c8;--line:#2a2f52;--action:#ff6a1f;--action-hover:#ff8a4c;--on-action:#0b1220;--info:#8eacff;
--night:#120c2a;--night-2:#1b1240;--bulb:#ffd36b;--red:#d62839;--cream:#fff3dc;--poster:#fbeed3;--p-ink:#2b1a12;--p-muted:#6d5442;--gold:#f2c14e;--teal:#2ec4b6;--pink:#ff5d8f;--wood:#6b3f1f;
--display:"Outfit",ui-sans-serif,system-ui,sans-serif;--sans:"Manrope",ui-sans-serif,system-ui,"Segoe UI",sans-serif;--fair:"Shrikhand","Outfit",cursive;--hand:"Caveat","Segoe Print",cursive;--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:25px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-bottom:60px;min-height:100vh;
 background:radial-gradient(600px 400px at 15% 20%,rgba(255,93,143,.10),transparent 70%),radial-gradient(500px 400px at 85% 40%,rgba(46,196,182,.09),transparent 70%),radial-gradient(700px 500px at 50% 100%,rgba(242,193,78,.08),transparent 70%),linear-gradient(180deg,#0b1220,var(--night) 40%,#0d0820);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-top:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:rgba(11,18,32,.92);backdrop-filter:blur(8px);margin:0 calc(-1*max(14px,env(safe-area-inset-left,0px)));padding:10px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.topin{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--display);font-size:17px}
.brand svg{width:26px;height:26px}.brand b{font-weight:700}
.me{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.me .av{width:30px;height:30px}
.tbtn{font:inherit;font-size:15px;line-height:1;min-width:36px;height:34px;border-radius:8px;border:1px solid var(--line);background:#131c2e;color:var(--ink);cursor:pointer;padding:0 8px}
@media(max-width:480px){.brand span{display:none}}

/* Panorama */
.pano{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/9;min-height:210px;background:#0a0720;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.pano canvas{position:absolute;inset:0;width:100%;height:100%}
.pano .ttl{position:absolute;left:0;right:0;bottom:10px;text-align:center;pointer-events:none}
.pano h1{margin:0;font-family:var(--fair);font-weight:400;font-size:clamp(21px,5.4vw,38px);line-height:1.1;color:#fff4d6;text-shadow:0 0 12px rgba(255,180,60,.8),0 3px 0 #b5361d,0 5px 10px rgba(0,0,0,.6)}
.pano p{margin:2px 0 0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#ffd9a0;text-shadow:0 1px 4px #000}

/* Glühbirnen-Rahmen */
.bulbs{position:relative;border-radius:16px;padding:6px;background:linear-gradient(180deg,#3a1d5c,#22103e)}
.bulbs::before{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
 background:radial-gradient(circle,var(--bulb) 0 2.6px,rgba(255,211,107,.35) 3.4px,transparent 5px) 0 0/18px 18px;
 -webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);padding:6px;animation:chase 1.1s steps(2) infinite}
@keyframes chase{50%{background-position:9px 9px}}
.bulbs > .inner{position:relative;border-radius:11px;background:linear-gradient(180deg,#1d1440,#130c2c);padding:18px 16px}

/* Anzeigetafel */
.board h2,.bude h3{font-family:var(--fair);font-weight:400;margin:0;line-height:1.15}
.board h2{font-size:26px;color:var(--gold);text-shadow:0 0 10px rgba(242,193,78,.45)}
.hello{margin:4px 0 0;color:var(--muted);font-size:15px}
.round{display:flex;gap:6px;margin:14px 0 6px}
.round span{flex:1;height:10px;border-radius:999px;background:#2a2052}
.round span.done{background:var(--teal)}.round span.now{background:var(--pink);box-shadow:0 0 10px var(--pink)}
.rlabel{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#d7c9ff}
.players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pl{position:relative;border-radius:12px;padding:10px 8px 12px;background:#24184d;border:1px solid #3d2f78;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pl.self{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,193,78,.25)}
.pl .av{width:54px;height:54px}
.pl b{font-size:15px;line-height:18px}
.pl small{font-size:12px;line-height:16px;color:var(--muted);min-height:32px}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:#3d2f78}
.dots i.done{background:var(--teal)}.dots i.now{background:var(--pink);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.state{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:1px 8px}
.state.play{background:var(--pink);color:#1a0a14}.state.wait{background:#3d2f78;color:#d7c9ff}.state.done{background:var(--teal);color:#062421}.state.away{background:#2a2052;color:#8e86b5}
.cheer{font:inherit;font-size:12px;border:1px dashed #6d5bb8;background:transparent;color:#d7c9ff;border-radius:999px;padding:2px 10px;cursor:pointer}
.word{margin-top:16px}
.slots{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:6px}
.slot{aspect-ratio:3/4;border-radius:6px;display:grid;place-items:center;font-family:var(--fair);font-size:clamp(14px,4.4vw,24px);color:#2b1a12;background:#2a2052;border:1px dashed #5a4aa0}
.slot.got{background:linear-gradient(180deg,#fff3dc,#f2c14e);border:0;box-shadow:0 3px 0 #a5761e;animation:flip .6s}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
.feed{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}
.feed li{font-size:14px;line-height:20px;color:#d9d3f2;display:flex;gap:8px}
.feed time{font-family:var(--mono);font-size:12px;color:#8e86b5;flex:none}
.cta{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:16px;text-align:center}
.wait{font-size:15px;color:#d7c9ff}
.mode{font-size:12px;line-height:17px;color:#8e86b5;text-align:center;margin:10px 0 0}

/* Plakat */
.poster{position:relative;color:var(--p-ink);padding:26px 22px 26px;border-radius:4px;background:var(--poster);
 background-image:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.6),transparent 50%),radial-gradient(ellipse at 90% 90%,rgba(180,120,60,.22),transparent 60%);
 box-shadow:inset 0 0 0 6px var(--poster),inset 0 0 0 8px var(--red),inset 0 0 0 11px var(--poster),inset 0 0 0 12px #2f4a9a,0 18px 40px rgba(0,0,0,.5)}
.poster .kick{display:block;text-align:center;font-weight:800;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
.poster h2{font-family:var(--fair);font-weight:400;text-align:center;font-size:clamp(28px,7.4vw,40px);line-height:1.1;margin:6px 0 4px;color:#2f4a9a;text-shadow:2px 2px 0 rgba(214,40,57,.25);text-wrap:balance}
.story{display:flex;flex-direction:column;gap:12px;margin-top:14px;font-size:17px;line-height:27px}
.story p{margin:0;hyphens:auto}
.cb{margin:10px 0 0;font-family:var(--hand);font-size:23px;line-height:28px;color:#b5361d;text-align:center;transform:rotate(-1deg)}
.readbtn{align-self:center;font:inherit;font-size:14px;font-weight:700;color:#2f4a9a;background:transparent;border:1.5px solid rgba(47,74,154,.5);border-radius:999px;padding:4px 14px;cursor:pointer}

/* Bude */
.bude{position:relative;border-radius:0 0 14px 14px;padding:58px 16px 18px;background:linear-gradient(180deg,#24184d,#170f33);border:1px solid #3d2f78;box-shadow:0 18px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:12px;margin-top:8px}
.bude::before{content:"";position:absolute;left:-6px;right:-6px;top:-8px;height:52px;border-radius:6px 6px 0 0;
 background:repeating-linear-gradient(90deg,var(--red) 0 34px,var(--cream) 34px 68px);box-shadow:0 6px 10px rgba(0,0,0,.35)}
.bude::after{content:"";position:absolute;left:-6px;right:-6px;top:42px;height:16px;
 background:radial-gradient(circle at 17px 0,var(--red) 16px,transparent 17px) 0 0/68px 16px repeat-x,radial-gradient(circle at 51px 0,var(--cream) 16px,transparent 17px) 0 0/68px 16px repeat-x}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.bude h3{font-size:24px;color:#fff4d6;text-shadow:0 0 10px rgba(255,180,60,.5)}
.tag{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 10px;background:var(--gold);color:#2b1a12}
.how{margin:0;font-size:15px;line-height:22px;color:#d7d0f0}
.field{background:radial-gradient(ellipse at 50% 20%,#2b1f5c,#140d2e);border:1px solid #3d2f78;border-radius:12px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;touch-action:manipulation}
.msg{margin:0;font-size:15px;line-height:22px;border-radius:10px;padding:10px 14px}
.msg.ok{background:#d4f5ee;color:#0b4d45}.msg.no{background:#ffe0e4;color:#8a1426}.msg.tip{background:var(--cream);color:var(--p-ink)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stars{font-size:22px;color:var(--gold);letter-spacing:3px}
.btn{font:inherit;font-weight:800;border-radius:12px;padding:10px 18px;min-height:46px;cursor:pointer;border:1px solid #5a4aa0;background:#2a2052;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--action);border-color:#c44d10;color:var(--on-action);box-shadow:0 4px 0 #a33c08}
.btn.primary:hover{background:var(--action-hover)}
.btn.gold{background:linear-gradient(180deg,#ffe08a,#e0a52a);border-color:#9a6a12;color:#2b1a12;box-shadow:0 4px 0 #9a6a12}
.btn.tip{background:transparent;color:var(--gold);border-color:rgba(242,193,78,.5)}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,.tbtn:focus-visible,.cheer:focus-visible,.readbtn:focus-visible,.q button:focus-visible,.mcard:focus-visible,.pipe:focus-visible,.pcell:focus-visible,.car:focus-visible,.ltile:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--info)}
.answer{display:flex;gap:8px}
.answer input{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--p-ink);background:var(--cream);border:2px solid #e0a52a;border-radius:10px;padding:8px 12px;min-height:50px}

/* Login */
.ticket{position:relative;max-width:420px;margin:0 auto;width:100%;color:var(--p-ink);background:var(--cream);border-radius:14px;padding:22px 20px 24px;box-shadow:0 18px 40px rgba(0,0,0,.5);
 -webkit-mask:radial-gradient(circle 12px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 12px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat}
.ticket .kick{display:block;text-align:center;font-weight:800;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--red)}
.ticket h2{font-family:var(--fair);font-weight:400;font-size:30px;line-height:1.1;text-align:center;margin:6px 0 4px;color:#2f4a9a}
.ticket p{margin:0;text-align:center;color:var(--p-muted);font-size:15px}
.ticket form{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.ticket .perf{border-top:2px dashed #d9c3a0;margin:18px -20px 0;padding-top:14px}
.ticket label{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--p-muted)}

/* Rätselbausteine */
.q{display:flex;flex-direction:column;gap:8px;width:100%}
.q strong{font-size:17px;line-height:24px}
.q button{font:inherit;text-align:left;border-radius:10px;border:1px solid #5a4aa0;background:#2a2052;color:var(--ink);padding:10px 12px;cursor:pointer;min-height:46px}
.q button.no{background:#5a1a2a;border-color:#a8324a;animation:shake .4s}
.q button.ok{background:#0f4d45;border-color:var(--teal)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qprog{font-size:13px;color:var(--muted)}
.lukas{display:flex;gap:16px;align-items:flex-end;justify-content:center;width:100%}
.tower{position:relative;width:70px;height:300px;border-radius:8px;background:linear-gradient(90deg,#3a1d5c,#5a2d8a,#3a1d5c);border:3px solid #f2c14e;overflow:hidden}
.tower .scale{position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 28px,rgba(255,255,255,.18) 28px 30px)}
.tower .bell{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:44px;height:30px;border-radius:22px 22px 6px 6px;background:linear-gradient(180deg,#ffe08a,#c98a1a);box-shadow:0 0 0 rgba(255,211,107,0)}
.tower .bell.ring{animation:ring .5s}
@keyframes ring{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-14deg);box-shadow:0 0 30px 10px rgba(255,211,107,.8)}75%{transform:translateX(-50%) rotate(14deg)}}
.tower .puck{position:absolute;left:50%;bottom:6px;width:30px;height:18px;margin-left:-15px;border-radius:6px;background:var(--red);box-shadow:0 0 10px var(--red);transition:bottom .45s cubic-bezier(.2,.8,.3,1)}
.meter{width:38px;height:300px;border-radius:999px;background:linear-gradient(0deg,#2ec4b6,#f2c14e 60%,#ff5d8f 85%,#ff2a2a);position:relative;border:2px solid #fff4d6}
.meter i{position:absolute;left:-6px;right:-6px;height:6px;border-radius:3px;background:#fff;box-shadow:0 0 6px #fff}
.meter b{position:absolute;left:-4px;right:-4px;top:7%;height:2px;background:#1a0a14}
.hits{font-family:var(--fair);font-size:22px;color:var(--gold)}
.diff{display:flex;flex-direction:column;gap:8px;width:100%;max-width:440px}
.diff svg{width:100%;height:auto;border-radius:8px;display:block}
.diff .bot{position:relative;cursor:crosshair}
.organ{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:360px;align-items:end}
.pipe{border:0;border-radius:30px 30px 8px 8px;cursor:pointer;opacity:.55;transition:opacity .1s,transform .1s;box-shadow:inset 0 -10px 0 rgba(0,0,0,.25),inset 0 6px 0 rgba(255,255,255,.3)}
.pipe.on{opacity:1;transform:translateY(-4px);box-shadow:0 0 26px 6px currentColor,inset 0 6px 0 rgba(255,255,255,.4)}
.rush{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:0;width:min(100%,330px);aspect-ratio:1;position:relative;background:repeating-linear-gradient(0deg,#1a1430 0 1px,transparent 1px 16.66%),repeating-linear-gradient(90deg,#1a1430 0 1px,transparent 1px 16.66%),#2a2a3a;border:4px solid #f2c14e;border-radius:10px;touch-action:none}
.rush .exit{position:absolute;right:-14px;top:33.33%;height:16.66%;width:10px;background:var(--teal);border-radius:0 6px 6px 0;box-shadow:0 0 12px var(--teal)}
.car{position:relative;margin:4px;border-radius:10px;border:0;cursor:grab;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 3px 6px rgba(0,0,0,.5);touch-action:none}
.car::after{content:"";position:absolute;inset:22% 18%;border-radius:6px;background:rgba(255,255,255,.25)}
.car.sel{outline:3px solid #fff}
.pathg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:min(100%,330px)}
.pcell{aspect-ratio:1;border-radius:8px;border:1px solid #5a4aa0;background:#2a2052;cursor:pointer;color:#fff4d6;font-size:22px;display:grid;place-items:center;padding:0;font-weight:800}
.pcell.on{background:var(--pink);border-color:#ffd0df;box-shadow:0 0 12px rgba(255,93,143,.6)}
.pcell.head{background:var(--gold);color:#2b1a12}
.pcell.blk{background:repeating-linear-gradient(90deg,var(--red) 0 8px,var(--cream) 8px 16px);cursor:not-allowed;font-size:20px}
.pcell.goal{outline:2px dashed var(--teal);outline-offset:-4px}
.sortlist{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:8px}
.sortitem{display:flex;align-items:center;gap:10px;background:var(--cream);color:var(--p-ink);border-radius:10px;padding:10px 8px 10px 14px;font-size:16px;line-height:22px;box-shadow:0 3px 0 #c9a46a}
.sortitem .t{flex:1}
.sortitem .bx{display:flex;flex-direction:column;gap:4px}
.icon{font:inherit;width:42px;height:34px;border-radius:8px;border:1px solid #9a6a12;background:linear-gradient(180deg,#ffe08a,#e0a52a);color:#2b1a12;cursor:pointer;font-weight:800}
.cans{width:100%;max-width:420px;aspect-ratio:4/3.4;touch-action:manipulation;border-radius:10px;cursor:pointer}
.jugs{display:flex;gap:28px;align-items:flex-end;justify-content:center}
.jug{display:flex;flex-direction:column;align-items:center;gap:6px}
.jug svg{width:90px;height:auto}
.jug b{font-family:var(--fair);font-weight:400;font-size:18px;color:var(--gold)}
.jbtns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%;max-width:380px}
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,360px)}
.mcard{aspect-ratio:3/4;border:0;border-radius:10px;cursor:pointer;font-size:clamp(26px,8vw,40px);display:grid;place-items:center;padding:0;background:repeating-linear-gradient(45deg,var(--red) 0 10px,#b51d2c 10px 20px);box-shadow:inset 0 0 0 3px var(--cream),0 3px 0 #6a1018;transition:transform .25s}
.mcard.open,.mcard.done{background:var(--cream);transform:rotateY(180deg)}
.mcard span{transform:rotateY(180deg);visibility:hidden}
.mcard.open span,.mcard.done span{visibility:visible}
.mcard.done{opacity:.65}
.shoot{width:100%;max-width:440px;aspect-ratio:4/3;border-radius:10px;touch-action:manipulation;cursor:crosshair}
.wheel{width:min(100%,290px);aspect-ratio:1;touch-action:none;cursor:grab}
.code{display:flex;gap:8px;justify-content:center}
.code span{width:44px;height:54px;border-radius:8px;display:grid;place-items:center;font-family:var(--fair);font-size:28px;background:#2a2052;border:1px dashed #5a4aa0;color:#fff4d6}
.code span.f{background:var(--cream);color:var(--p-ink);border:0}
.ltiles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ltile{width:44px;height:54px;border-radius:8px;font-family:var(--fair);font-size:26px;border:0;color:#2b1a12;cursor:pointer;background:linear-gradient(180deg,#fff3dc,#f2c14e);box-shadow:0 3px 0 #a5761e}
.ltile.used{opacity:.25}
.aslots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;padding:10px;border-radius:12px;background:#140d2e;border:1px solid #3d2f78}
.aslot{width:40px;height:50px;border-radius:8px;border:2px dashed #5a4aa0;display:grid;place-items:center;font-family:var(--fair);font-size:24px;color:#2b1a12;background:transparent;padding:0}

<script>
(function(){
'use strict';
const D=window.KIRMES,{P,ORDER,ROUNDS,R}=D;
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const norm=s=>String(s).toUpperCase().replace(/Ä/g,'AE').replace(/Ö/g,'OE').replace(/Ü/g,'UE').replace(/ß/g,'SS').replace(/[^A-Z0-9]/g,'');
const DPR=()=>Math.min(2,window.devicePixelRatio||1);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const SS={get(k){try{return sessionStorage.getItem(k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}};
const app=$('#app');
let cleanups=[];const cleanup=()=>{cleanups.forEach(f=>{try{f();}catch(e){}});cleanups=[];try{speechSynthesis.cancel();}catch(e){}};
const NR=R.length;

/* ---------- Spielstand: gemeinsamer Reducer (gleich wie im Apps Script) ---------- */
function reduce(st,ev){
  if(!st||ev.k==='reset')st={v:1,p:{},feed:[],fin:null};
  const t=ev.t||Date.now();if(!ev.p)return st;
  const p=st.p[ev.p]=st.p[ev.p]||{s:{},join:0,seen:0};
  const push=o=>{st.feed.push(Object.assign({t,p:ev.p},o));if(st.feed.length>40)st.feed=st.feed.slice(-40);};
  if(ev.k==='join'){if(!p.join){p.join=t;push({k:'join'});}p.seen=t;}
  if(ev.k==='seen')p.seen=t;
  if(ev.k==='solve'&&ev.r!=null&&!p.s[ev.r]){p.s[ev.r]={t,tips:ev.tips|0,l:String(ev.l||'').slice(0,1)};push({k:'solve',r:ev.r,tips:ev.tips|0});}
  if(ev.k==='cheer'&&ev.to){push({k:'cheer',to:ev.to,e:String(ev.e||'👏').slice(0,4)});}
  if(ev.k==='final'&&!st.fin){st.fin={p:ev.p,t};push({k:'final'});}
  return st;
}

/* ---------- Sync: Apps Script, sonst lokaler Testmodus ---------- */
const API=(window.KIRMES_API||LS.get('kirmes-api','')||'').trim();
const LKEY='kirmes-state-'+D.GAME;
let ST=null,onState=()=>{};
const Sync={
  remote:!!API,
  async pull(){if(!API){ST=LS.get(LKEY,null)||reduce(null,{});return ST;}
    try{const r=await fetch(API+'?g='+encodeURIComponent(D.GAME)+'&a=get',{cache:'no-store'});const j=await r.json();if(j&&j.state!==undefined)ST=j.state||reduce(null,{});}catch(e){Sync.err=true;}return ST;},
  async send(ev){ev.t=Date.now();
    if(!API){ST=reduce(LS.get(LKEY,null),ev);LS.set(LKEY,ST);onState();return ST;}
    ST=reduce(JSON.parse(JSON.stringify(ST||null)),ev);onState();
    try{const r=await fetch(API+'?g='+encodeURIComponent(D.GAME)+'&a=ev&d='+encodeURIComponent(JSON.stringify(ev)),{cache:'no-store'});const j=await r.json();if(j&&j.state)ST=j.state;Sync.err=false;}catch(e){Sync.err=true;}
    onState();return ST;}
};
window.addEventListener('storage',e=>{if(e.key===LKEY&&!API){ST=LS.get(LKEY,null);onState();}});
let poll=null;function startPoll(){clearInterval(poll);if(!API)return;poll=setInterval(async()=>{if(document.hidden)return;await Sync.pull();onState();},6000);}

/* ---------- Ableitungen ---------- */
const solved=(p,r)=>!!(ST&&ST.p[p]&&ST.p[p].s[r]);
const nSolved=p=>{let n=0;for(let r=0;r<NR;r++)if(solved(p,r))n++;return n;};
const roundDone=r=>ORDER.every(p=>solved(p,r));
const curRound=()=>{let r=0;while(r<NR&&roundDone(r))r++;return r;};
const myNext=p=>{for(let r=0;r<NR;r++)if(!solved(p,r))return r;return NR;};
const canPlay=(p,r)=>r<NR&&!solved(p,r)&&(r===0||roundDone(r-1));
const letters=()=>{const a=[];ORDER.forEach(p=>{for(let r=0;r<NR;r++){const s=ST&&ST.p[p]&&ST.p[p].s[r];if(s)a.push({l:s.l||R[r][p].letter,t:s.t,p,r});}});return a.sort((x,y)=>x.t-y.t);};
const fastest=r=>{let b=null;ORDER.forEach(p=>{const s=ST.p[p]&&ST.p[p].s[r];if(s&&(!b||s.t<b.t))b={p,t:s.t};});return b&&b.p;};
const online=p=>ST&&ST.p[p]&&Date.now()-ST.p[p].seen<90000;

/* ---------- Ton ---------- */
let AC=null,MUTE=LS.get('kirmes-mute',false);
const ac=()=>{if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC.state==='suspended')AC.resume();return AC;};
let MASTER=null;const out=()=>{const a=ac();if(!a)return null;if(!MASTER){MASTER=a.createGain();MASTER.gain.value=MUTE?0:1;MASTER.connect(a.destination);}return MASTER;};
let NB=null;const noiseBuf=a=>{if(!NB){NB=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return NB;};
function noise({dur=.2,type='bandpass',f=1000,f2=null,q=1,vol=.3,at=0,att=.005,dest=null}){const a=ac(),o=dest||out();if(!a||!o)return;const t=a.currentTime+at,s=a.createBufferSource();s.buffer=noiseBuf(a);const fl=a.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(g);g.connect(o);s.start(t,Math.random()*1.5);s.stop(t+dur+.05);}

function ambient(on){const a=ac(),o=out();if(!a||!o)return;
  if(on&&!AMB){const bus=a.createGain();bus.gain.value=1;bus.connect(o);const mus=a.createGain();mus.gain.value=1;mus.connect(bus);
    const s=a.createBufferSource();s.buffer=noiseBuf(a);s.loop=true;const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=520;bp.Q.value=.6;const g=a.createGain();g.gain.value=.05;s.connect(bp);bp.connect(g);g.connect(bus);s.start();
    const lfo=setInterval(()=>{g.gain.setTargetAtTime(.03+Math.random()*.04,a.currentTime,.8);},1500);

      WALTZ[k].forEach((m,j)=>{if(m){let len=1;while(j+len<3&&WALTZ[k][j+len]===0)len++;organ(mf(m),j*B,len*B*.92,.04,mus);}});

const BUL=['#ffd36b','#ff5d8f','#2ec4b6','#8eacff','#ff6a1f'];
function pano(root,{title,sub}={}){const box=el('div','pano');box.innerHTML=`<canvas aria-hidden="true"></canvas><div class="ttl"><h1>${title||'Das Geheimnis der Dicken Gertrud'}</h1><p>${sub||'Allerheiligenkirmes · Soest'}</p></div>`;root.appendChild(box);
  const cv=box.querySelector('canvas'),x=cv.getContext('2d');let W=0,H=0,raf=0,t0=performance.now();const fw=[];const stars=Array.from({length:60},()=>[Math.random(),Math.random()*.5,Math.random()]);
  const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rs=()=>{const d=DPR();W=box.clientWidth;H=box.clientHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);};rs();
  const tower=(cx,base,w,h,roof,col)=>{x.fillStyle=col;x.fillRect(cx-w/2,base-h,w,h);x.beginPath();x.moveTo(cx-w/2-2,base-h);x.lineTo(cx,base-h-roof);x.lineTo(cx+w/2+2,base-h);x.fill();};
  const draw=now=>{const t=(now-t0)/1000;
    const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#090620');g.addColorStop(.7,'#26124a');g.addColorStop(1,'#4a1d4a');x.fillStyle=g;x.fillRect(0,0,W,H);
    stars.forEach(([sx,sy,ph])=>{x.fillStyle=`rgba(255,240,220,${.3+.5*Math.abs(Math.sin(t*1.5+ph*9))})`;x.fillRect(sx*W,sy*H,1.4,1.4);});
    const base=H*.78,u=H/100;
    // Patrokli
    x.fillStyle='#1a1430';tower(W*.18,base,u*13,u*40,u*12,'#1a1430');x.fillRect(W*.18-u*12,base-u*20,u*24,u*20);[-1,1].forEach(s=>{tower(W*.18+s*u*7.5,base-u*40,u*2.4,u*4,u*6,'#1a1430');});

    // Häuser
    x.fillStyle='#120d26';for(let i=0;i<14;i++){const hx=i*W/13-10,hh=u*(14+(i*37)%10);x.beginPath();x.moveTo(hx,base);x.lineTo(hx,base-hh);x.lineTo(hx+W/26,base-hh-u*7);x.lineTo(hx+W/13,base-hh);x.lineTo(hx+W/13,base);x.fill();x.fillStyle='rgba(255,200,110,.55)';x.fillRect(hx+W/40,base-hh+u*4,u*2.4,u*3);x.fillStyle='#120d26';}

    const rot=red?0:t*.18;x.strokeStyle='rgba(255,211,107,.35)';x.lineWidth=1.2;x.beginPath();x.arc(rx,ry,rr,0,7);x.stroke();
    for(let k=0;k<16;k++){const a=rot+k*Math.PI/8,ex=rx+Math.cos(a)*rr,ey=ry+Math.sin(a)*rr;x.beginPath();x.moveTo(rx,ry);x.lineTo(ex,ey);x.stroke();

    raf=requestAnimationFrame(draw);};

const PUZ={
quiz(f,api,R){let i=0;const show=()=>{const [q,opts,a]=R.qs[i];f.innerHTML=`<div class="q"><span class="qprog">Frage ${i+1} von ${R.qs.length}</span><strong>${q}</strong>${opts.map((o,k)=>`<button type="button" data-k="${k}">${o}</button>`).join('')}</div>`;

lukas(f,api){f.innerHTML=`<div class="lukas"><div class="tower"><div class="scale"></div><div class="bell" id="bell"></div><div class="puck" id="puck"></div></div><div class="meter" id="meter"><b></b><i id="ptr"></i></div></div><div class="hits" id="hits">Glocke: ☆☆☆</div><button class="btn primary" id="hit" type="button" style="min-width:200px">🔨 Zuschlagen!</button>`;
  const ptr=f.querySelector('#ptr'),puck=f.querySelector('#puck'),bell=f.querySelector('#bell'),hb=f.querySelector('#hit');let v=0,dir=1,sp=1.5,hits=0,raf=0,lock=false,last=performance.now();
  const loop=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;if(!lock){v+=dir*sp*dt;if(v>1){v=1;dir=-1;}if(v<0){v=0;dir=1;}ptr.style.bottom=`calc(${v*100}% - 3px)`;}raf=requestAnimationFrame(loop);};raf=requestAnimationFrame(loop);

    setTimeout(()=>{if(h>=.93){hits++;bell.classList.remove('ring');void bell.offsetWidth;bell.classList.add('ring');sfx('bell');api.say(['Ding! Einmal!','Ding! Zweimal!','Ding! Dreimal!'][hits-1],'ok');}else api.say(h>.75?'Knapp! Fast an der Glocke.':h>.45?'Na, das war eher ein Streicheln.':'Der Lukas hat nicht mal gemerkt, dass du da warst.','no');

diff(f,api){f.innerHTML=`<div class="diff"><div>${booth()}</div><div class="bot" id="bot">${booth({bal:1,roof:1,star:1,txt:1,flag:1})}<svg viewBox="0 0 400 240" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none" id="marks"></svg></div></div><div class="hits" id="cnt">0 von 5</div>`;
  const bot=f.querySelector('#bot'),marks=f.querySelector('#marks');const got=new Set();
  bot.addEventListener('click',e=>{const r=bot.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*400,y=(e.clientY-r.top)/r.height*240;const hit=DIFFS.findIndex((d,k)=>!got.has(k)&&Math.hypot(d.x-x,d.y-y)<d.r+6);
    if(hit<0){sfx('click');return;}got.add(hit);const d=DIFFS[hit];marks.insertAdjacentHTML('beforeend',`<circle cx="${d.x}" cy="${d.y}" r="${d.r}" fill="none" stroke="#ffd36b" stroke-width="4"/>`);sfx('bell');f.querySelector('#cnt').textContent=got.size+' von 5';if(got.size===5)setTimeout(()=>api.solved(),500);});},
organ(f,api){const C=[['#ff5d8f',60,170],['#8eacff',64,200],['#ffd36b',67,230],['#2ec4b6',72,260]];
  f.innerHTML=`<div class="organ">${C.map(([c,m,h],k)=>`<button class="pipe" type="button" data-k="${k}" aria-label="Pfeife ${k+1}" style="background:${c};color:${c};height:${h}px"></button>`).join('')}</div><div class="hits" id="lvl">Töne: 1 von 5</div><button class="btn" id="rep" type="button">Noch mal vorspielen</button>`;
  const pipes=[...f.querySelectorAll('.pipe')];const seq=Array.from({length:5},()=>Math.floor(Math.random()*4));let n=1,pos=0,busy=true,tms=[];
  const light=(k,ms)=>{pipes[k].classList.add('on');organ(mf(C[k][1]),0,ms/1000,.09);tms.push(setTimeout(()=>pipes[k].classList.remove('on'),ms));};
  const playSeq=()=>{busy=true;pos=0;duck(n*700+600);seq.slice(0,n).forEach((k,i)=>tms.push(setTimeout(()=>light(k,450),500+i*650)));tms.push(setTimeout(()=>busy=false,500+n*650));};
  pipes.forEach(p=>p.onclick=()=>{if(busy)return;const k=+p.dataset.k;light(k,260);if(k!==seq[pos]){api.wrong('Schiefer Ton! Hör noch einmal hin.');busy=true;tms.push(setTimeout(playSeq,900));return;}pos++;if(pos>=n){if(n>=5){busy=true;tms.push(setTimeout(()=>api.solved(),500));return;}n++;f.querySelector('#lvl').textContent=`Töne: ${n} von 5`;api.say('Richtig! Jetzt ein Ton mehr.','ok');tms.push(setTimeout(playSeq,900));}});
  f.querySelector('#rep').onclick=()=>{if(!busy)playSeq();};tms.push(setTimeout(playSeq,600));

wheel(f,api,R){f.innerHTML=`<ol class="how" style="margin:0;padding-left:22px;align-self:stretch">${R.clues.map(c=>`<li>${c}</li>`).join('')}</ol><canvas class="wheel" id="wh" aria-label="Glücksrad zum Drehen"></canvas><div class="code" id="cd">${R.code.map(()=>'<span></span>').join('')}</div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="icon" id="l" type="button" aria-label="Links drehen">◀</button><button class="btn gold small" id="ok" type="button">Zahl einrasten</button><button class="icon" id="r" type="button" aria-label="Rechts drehen">▶</button><button class="btn small" id="cl" type="button">Löschen</button></div>`;
