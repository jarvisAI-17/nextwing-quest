<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Der Polarstern-Advent</title>
<meta name="description" content="Ein Rätsel-Adventskalender: 24 Splitter, 24 Geschenke, ein Stern, der wieder leuchten muss.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&family=Mountains+of+Christmas:wght@700&family=Caveat:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: Nordpoldorf in der Winternacht. Nextwing-Kopfzeile bleibt; oben das Dorf-Panorama mit Polarlicht, Schneefall und dem Polarstern, der mit jedem gefundenen Splitter heller wird; darunter das Adventskalenderhaus mit 24 Fenstern, die Anzeigetafel, Geschichten auf Briefpapier vom Nordpol, Rätsel auf der Wichtel-Werkbank. Nur dunkel: Winternacht. */
:root{--surface:#0b1220;--ink:#f3f1ea;--muted:#a9b3c9;--line:#26355a;--action:#ff6a1f;--action-hover:#ff8a4c;--on-action:#0b1220;--info:#8eacff;
--night:#081226;--night-2:#0f1f3d;--red:#c8203a;--red-2:#8e1426;--green:#1f6b45;--green-2:#134a30;--gold:#f0c869;--gold-2:#b88a2c;--snow:#f6f3ea;--paper:#fbf6ea;--p-ink:#2a1c14;--p-muted:#6d5644;--ice:#bfe6ff;
--display:"Outfit",ui-sans-serif,system-ui,sans-serif;--sans:"Manrope",ui-sans-serif,system-ui,"Segoe UI",sans-serif;--xmas:"Mountains of Christmas","Outfit",cursive;--hand:"Caveat","Segoe Print",cursive;--serif:"EB Garamond",Georgia,serif;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:25px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-bottom:60px;min-height:100vh;
 background:radial-gradient(900px 500px at 50% -10%,rgba(80,200,170,.10),transparent 70%),radial-gradient(700px 500px at 80% 30%,rgba(140,110,255,.07),transparent 70%),linear-gradient(180deg,#0b1220,var(--night) 30%,#06101f);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
#snow{position:fixed;inset:0;pointer-events:none;z-index:1}
.wrap{position:relative;z-index:2;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-top:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:rgba(11,18,32,.92);backdrop-filter:blur(8px);margin:0 calc(-1*max(14px,env(safe-area-inset-left,0px)));padding:10px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--display);font-size:17px}
.brand svg{width:26px;height:26px}.brand b{font-weight:700}
.me{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.tbtn{font:inherit;font-size:15px;line-height:1;min-width:36px;height:34px;border-radius:8px;border:1px solid var(--line);background:#131c2e;color:var(--ink);cursor:pointer;padding:0 8px}
@media(max-width:480px){.brand span{display:none}}
/* Panorama */
.pano{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;min-height:220px;background:#06101f;box-shadow:0 0 0 1px rgba(240,200,105,.35),0 20px 50px rgba(0,0,0,.55)}
.pano canvas{position:absolute;inset:0;width:100%;height:100%}
.pano .ttl{position:absolute;left:0;right:0;bottom:12px;text-align:center;pointer-events:none;padding:0 10px}
.pano h1{margin:0;font-family:var(--xmas);font-weight:700;font-size:clamp(24px,6vw,48px);line-height:1.05;color:#fff6dc;text-shadow:0 0 14px rgba(240,200,105,.7),0 3px 0 #8e1426,0 6px 14px rgba(0,0,0,.6)}
.pano p{margin:4px 0 0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#cfe4ff;text-shadow:0 1px 4px #000}
/* Kalenderhaus */
.house{position:relative;padding:16px 14px 18px;border-radius:12px 12px 8px 8px;background:linear-gradient(180deg,#7a2232,#5c1424);box-shadow:inset 0 0 0 4px #4a0f1c,inset 0 0 40px rgba(0,0,0,.35),0 20px 40px rgba(0,0,0,.5)}
.house::before{content:"";position:absolute;left:-10px;right:-10px;top:-42px;height:46px;background:linear-gradient(180deg,#f6f3ea,#dfe9f3);clip-path:polygon(0 100%,8% 30%,20% 55%,32% 20%,50% 0,68% 20%,80% 55%,92% 30%,100% 100%);filter:drop-shadow(0 -2px 0 rgba(255,255,255,.4))}
.house h2{margin:0 0 12px;text-align:center;font-family:var(--xmas);font-size:30px;color:var(--gold);text-shadow:0 2px 0 #4a0f1c}
.doors{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media(max-width:520px){.doors{grid-template-columns:repeat(4,1fr)}}
.door{position:relative;min-width:0;aspect-ratio:3/4;overflow:visible;border-radius:6px;perspective:600px;border:0;padding:0;background:#1a0a10;cursor:pointer;color:inherit;font:inherit;box-shadow:inset 0 0 0 2px var(--gold-2)}
.door .in{position:absolute;inset:3px;border-radius:4px;background:radial-gradient(circle at 50% 40%,#fff6dc,#f0c869 70%);display:grid;place-items:center;font-family:var(--xmas);font-size:clamp(22px,6vw,32px);color:var(--red-2)}
.door .lid{position:absolute;inset:0;border-radius:6px;transform-origin:left center;transition:transform .9s cubic-bezier(.3,.8,.3,1),opacity .35s .55s;background:linear-gradient(135deg,var(--green),var(--green-2));box-shadow:inset 0 0 0 2px var(--gold-2),inset 0 0 14px rgba(0,0,0,.35);display:grid;place-items:center}
.door:nth-child(3n+2) .lid{background:linear-gradient(135deg,var(--red),var(--red-2))}
.door:nth-child(5n+3) .lid{background:linear-gradient(135deg,#2b4a8a,#1a2f5c)}
.door .lid b{font-family:var(--xmas);font-size:clamp(20px,5.5vw,30px);color:#fff6dc;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.door .lid i{position:absolute;bottom:4px;right:6px;font-style:normal;font-size:11px;font-weight:800;color:#fff6dc;opacity:.85}
.door.open .lid{transform:rotateY(-100deg);opacity:0;box-shadow:none;pointer-events:none}
.door.today{box-shadow:inset 0 0 0 2px var(--gold),0 0 18px 4px rgba(240,200,105,.55);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 0 0 2px var(--gold),0 0 30px 8px rgba(240,200,105,.8)}}
.door.locked{cursor:default}
.door.locked .lid::after{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(160deg,rgba(220,240,255,.28),rgba(220,240,255,.06) 40%,rgba(220,240,255,.2));pointer-events:none}
.door.wait .lid{filter:saturate(1.2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:12px;color:#ffd9de}
/* Tafel */
.board{background:linear-gradient(180deg,#12234a,#0c1834);border:1px solid #2c4278;border-radius:16px;padding:18px 16px;box-shadow:0 20px 40px rgba(0,0,0,.45)}
.board h2{font-family:var(--xmas);font-weight:700;font-size:30px;line-height:1.1;margin:0;color:var(--gold)}
.hello{margin:4px 0 0;color:var(--muted);font-size:15px}
.meter{margin:14px 0 4px;height:14px;border-radius:999px;background:#0a142b;border:1px solid #2c4278;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#8ecbff,#fff6dc);box-shadow:0 0 14px #bfe6ff}
.rlabel{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#cfe4ff}
.todaybox{margin-top:14px;display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.04);border:1px dashed #3a5592;border-radius:12px;padding:12px}
.todaybox .av{width:56px;height:56px;flex:none}
.todaybox b{display:block;font-size:17px}
.todaybox small{color:var(--muted);font-size:13px;line-height:19px;display:block}
.ppl{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ppl span{display:inline-flex;align-items:center;gap:6px;font-size:13px;border-radius:999px;padding:2px 10px 2px 3px;background:#16295a;border:1px solid #2c4278}
.ppl span .av{width:22px;height:22px}
.ppl span.on{border-color:#5fd3a0}
.ppl span em{font-style:normal;color:var(--gold);font-weight:800}
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:8px}
.pc{position:relative;border-radius:12px;padding:10px 6px 12px;background:#16295a;border:1px solid #2c4278;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.pc .av{width:50px;height:50px}
.pc b{font-size:15px;line-height:18px}
.pc small{font-size:12px;line-height:16px;color:var(--muted)}
.pc.self{border-color:var(--gold);box-shadow:0 0 0 2px rgba(240,200,105,.25)}
.pc.now{border-color:#ff8fb0;box-shadow:0 0 16px rgba(255,93,143,.45)}
.pc.now .av{animation:wob 1.2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-8deg) translateY(-3px)}}
.pst{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:1px 8px}
.pst.play{background:#ff5d8f;color:#1a0a14;animation:pblink 1.2s infinite}.pst.done{background:#5fd3a0;color:#062421}.pst.on{background:#2c4278;color:#cfe4ff}
@keyframes pblink{50%{opacity:.55}}
.phrase{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:8px}
.phrase span{aspect-ratio:3/4;border-radius:4px;display:grid;place-items:center;font-family:var(--xmas);font-size:clamp(13px,3.8vw,20px);background:#0a142b;border:1px dashed #2c4278;color:#2c4278}
.phrase span.got{background:linear-gradient(180deg,#e9f6ff,#9fd2ff);color:#0b2a4a;border:0;box-shadow:0 0 10px rgba(191,230,255,.6)}
.feed{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:200px;overflow:auto}
.feed li{font-size:14px;line-height:20px;color:#dbe4f5;display:flex;gap:8px}
.feed time{font-size:12px;color:#7f8db0;flex:none;font-variant-numeric:tabular-nums}
.cta{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:16px;text-align:center}
.wait{font-size:15px;color:#cfe4ff;margin:0}
.mode{font-size:12px;line-height:17px;color:#7f8db0;text-align:center;margin:12px 0 0}
.lnk{font:inherit;font-size:12px;border:1px dashed #3a5592;background:transparent;color:#cfe4ff;border-radius:999px;padding:2px 10px;cursor:pointer}
/* Brief vom Nordpol */
.letter{position:relative;color:var(--p-ink);padding:30px 22px 26px;border-radius:6px;background:var(--paper);font-family:var(--serif);font-size:19px;line-height:30px;
 background-image:radial-gradient(ellipse at 15% 0%,rgba(255,255,255,.7),transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(200,150,90,.18),transparent 60%);
 box-shadow:inset 0 0 0 8px var(--paper),inset 0 0 0 10px var(--red),inset 0 0 0 12px var(--paper),inset 0 0 0 13px var(--green),0 20px 40px rgba(0,0,0,.5)}
.letter .holly{position:absolute;width:64px;height:64px}
.letter .holly.l{left:-8px;top:-10px}.letter .holly.r{right:-8px;top:-10px;transform:scaleX(-1)}
.letter .kick{display:block;text-align:center;font-family:var(--sans);font-weight:800;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--red)}
.letter h2{font-family:var(--xmas);font-weight:700;text-align:center;font-size:clamp(30px,7.6vw,44px);line-height:1.08;margin:4px 0 6px;color:var(--green-2);text-wrap:balance}
.story{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.story p{margin:0;hyphens:auto}
.cb{margin:10px 0 0;font-family:var(--hand);font-size:24px;line-height:29px;color:var(--red);text-align:center;transform:rotate(-1deg)}
.readbtn{align-self:center;font:inherit;font-family:var(--sans);font-size:14px;font-weight:700;color:var(--green-2);background:transparent;border:1.5px solid rgba(19,74,48,.5);border-radius:999px;padding:4px 14px;cursor:pointer}
.cast{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px;font-size:16px;line-height:23px}
.cast b{color:var(--red-2)}
/* Werkbank */
.bench{position:relative;border-radius:14px;padding:20px 16px 18px;display:flex;flex-direction:column;gap:12px;color:#fbf2df;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 22px,rgba(255,255,255,.03) 22px 24px,rgba(0,0,0,.06) 24px 46px),linear-gradient(180deg,#6b4226,#4a2c18);
 box-shadow:inset 0 0 0 6px transparent,0 20px 40px rgba(0,0,0,.5);border:6px solid transparent;border-image:repeating-linear-gradient(45deg,#c8203a 0 10px,#f6f3ea 10px 20px) 6}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bench h3{margin:0;font-family:var(--xmas);font-weight:700;font-size:28px;line-height:1.1;color:#fff6dc;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.tag{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 10px;background:var(--gold);color:#2a1c14}
.tag.help{background:#bfe6ff;color:#0b2a4a}
.how{margin:0;font-size:15px;line-height:22px;color:#f1e3c8}
.field{background:radial-gradient(ellipse at 50% 20%,#3a2414,#22140a);border:1px solid #7a5234;border-radius:12px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;touch-action:manipulation;color:#fbf2df}
.msg{margin:0;font-size:15px;line-height:22px;border-radius:10px;padding:10px 14px}
.msg.ok{background:#d9f5e6;color:#0f4d2e}.msg.no{background:#ffe0e4;color:#8e1426}.msg.tip{background:var(--paper);color:var(--p-ink)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stars{font-size:22px;color:var(--gold);letter-spacing:3px}
.btn{font:inherit;font-weight:800;border-radius:12px;padding:10px 18px;min-height:46px;cursor:pointer;border:1px solid #c9a46a;background:var(--paper);color:var(--p-ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--action);border-color:#c44d10;color:var(--on-action);box-shadow:0 4px 0 #a33c08}
.btn.primary:hover{background:var(--action-hover)}
.btn.gold{background:linear-gradient(180deg,#ffe7a3,#e0a52a);border-color:#9a6a12;color:#2a1c14;box-shadow:0 4px 0 #9a6a12}
.btn.tip{background:transparent;color:var(--gold);border-color:rgba(240,200,105,.55)}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,.tbtn:focus-visible,.door:focus-visible,.lnk:focus-visible,.readbtn:focus-visible,.q button:focus-visible,.mcard:focus-visible,.bell:focus-visible,.pcell:focus-visible,.gcell:focus-visible,.boot:focus-visible,.cl:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--info)}
.answer{display:flex;gap:8px}
.answer input{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--p-ink);background:var(--paper);border:2px solid #e0a52a;border-radius:10px;padding:8px 12px;min-height:50px}
/* Login */
.ticket{max-width:430px;margin:0 auto;width:100%;color:var(--p-ink);background:var(--paper);border-radius:14px;padding:24px 20px;box-shadow:inset 0 0 0 6px var(--paper),inset 0 0 0 8px var(--red),0 20px 40px rgba(0,0,0,.5);text-align:center}
.ticket .kick{font-weight:800;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--red)}
.ticket h2{font-family:var(--xmas);font-size:34px;line-height:1.1;margin:6px 0;color:var(--green-2)}
.ticket p{margin:0;color:var(--p-muted);font-size:15px}
.ticket form{display:flex;flex-direction:column;gap:10px;margin-top:16px;text-align:left}
.ticket label{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--p-muted)}
/* Rätsel-Bausteine */
.diff{display:flex;flex-direction:column;gap:8px;width:100%;max-width:460px}
.diff svg{width:100%;height:auto;border-radius:8px;display:block}
.diff .bot{position:relative;cursor:crosshair}
.hits{font-family:var(--xmas);font-size:24px;color:var(--gold)}
.sortlist{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:8px}
.sortitem{display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--p-ink);border-radius:10px;padding:10px 8px 10px 14px;font-size:16px;line-height:22px;box-shadow:0 3px 0 #c9a46a}
.sortitem .t{flex:1}.sortitem .bx{display:flex;flex-direction:column;gap:4px}
.icon{font:inherit;width:42px;height:34px;border-radius:8px;border:1px solid #9a6a12;background:linear-gradient(180deg,#ffe7a3,#e0a52a);color:#2a1c14;cursor:pointer;font-weight:800}
.cstrip{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.cl{font:inherit;width:42px;padding:4px 0 2px;border-radius:6px;border:1px solid #c9a46a;background:var(--paper);color:#2f5d8a;cursor:pointer;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 #9a6a12}
.cl b{font-family:var(--hand);font-size:28px;line-height:30px}
.cl i{font-style:normal;font-family:var(--xmas);font-weight:700;font-size:20px;line-height:22px;color:var(--red);border-top:1px dashed #c9a46a;width:80%;text-align:center}
.cl.on{outline:3px solid var(--action);transform:translateY(-2px)}
.cgap{width:14px}
.chint{margin:0;font-size:14px;line-height:20px;color:#f1e3c8;text-align:center;max-width:44ch}
.cipher{width:min(100%,290px);aspect-ratio:1;touch-action:none;user-select:none;cursor:grab}
.label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e6d5b0}
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,360px)}
.mcard{aspect-ratio:3/4;border:0;border-radius:10px;cursor:pointer;font-size:clamp(26px,8vw,40px);display:grid;place-items:center;padding:0;background:repeating-linear-gradient(45deg,var(--red) 0 10px,var(--red-2) 10px 20px);box-shadow:inset 0 0 0 3px var(--paper),0 3px 0 #4a0f1c;transition:transform .25s}
.mcard.open,.mcard.done{background:var(--paper);transform:rotateY(180deg)}
.mcard span{transform:rotateY(180deg);visibility:hidden}
.mcard.open span,.mcard.done span{visibility:visible}
.mcard.done{opacity:.65}
.pathg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:min(100%,330px)}
.pcell{aspect-ratio:1;border-radius:8px;border:1px solid #a9c9e8;background:#e9f3fb;cursor:pointer;color:#0b2a4a;font-size:22px;display:grid;place-items:center;padding:0;font-weight:800;box-shadow:inset 0 -3px 0 #c6dcef}
.pcell.on{background:#8ecbff;border-color:#4a8ac8}
.pcell.head{background:var(--gold)}
.pcell.blk{background:#1f6b45;cursor:not-allowed;font-size:22px}
.pcell.goal{outline:2px dashed var(--red);outline-offset:-4px}
.boots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.boot{font:inherit;border:2px solid transparent;border-radius:12px;background:rgba(255,255,255,.05);padding:10px 6px;cursor:pointer;color:#fbf2df;display:flex;flex-direction:column;align-items:center;gap:6px}
.boot svg{width:70px;height:80px}
.boot p{margin:0;font-family:var(--hand);font-size:19px;line-height:22px;background:var(--paper);color:var(--p-ink);padding:6px 8px;border-radius:4px;transform:rotate(-2deg)}
.boot.sel{border-color:var(--gold);background:rgba(240,200,105,.12)}
.bells{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:380px}
.bell{border:0;background:transparent;cursor:pointer;padding:0;transition:transform .12s;filter:brightness(.7)}
.bell svg{width:100%;height:auto}
.bell.on{filter:brightness(1.25) drop-shadow(0 0 16px currentColor);transform:rotate(-12deg) translateY(-4px)}
.secret{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
@media(max-width:480px){.secret{grid-template-columns:1fr}}
.sc{background:var(--paper);color:var(--p-ink);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.sc strong{font-size:15px}
.sc ul{margin:0;padding-left:18px;font-family:var(--hand);font-size:21px;line-height:26px;color:#24366b}
.grid{display:grid;grid-template-columns:minmax(80px,1.2fr) repeat(4,1fr);gap:4px;width:100%;max-width:520px}
.grid .h{font-size:11px;line-height:14px;color:#ffe7a3;display:grid;place-items:end center;text-align:center;padding-bottom:4px;font-weight:700}
.grid .rh{font-size:14px;font-weight:700;display:flex;align-items:center}
.gcell{aspect-ratio:1;border-radius:6px;border:1px solid #c9a46a;background:var(--paper);cursor:pointer;font:800 22px/1 var(--sans);color:#2a1c14;padding:0;display:grid;place-items:center}
.gcell.x{color:#8e1426}.gcell.y{background:#d9f5e6;color:#0f4d2e}
.pending{text-align:center;color:#f1e3c8;font-size:15px}
/* Gewinn */
.lose{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(4,10,24,.84);backdrop-filter:blur(4px)}
.lose .card{width:min(88vw,330px);border-radius:16px;padding:24px;text-align:center;color:var(--p-ink);background:var(--paper);box-shadow:0 0 60px rgba(191,230,255,.55);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.lose .shard{width:120px;height:120px;margin:0 auto}
.lose p{margin:8px 0 14px}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.npc{display:flex;gap:10px;align-items:flex-end}
.npc .av{width:64px;height:64px;flex:none}
.bubble{position:relative;background:#fffdf6;color:#2a1c14;border:2.5px solid #2a1c14;border-radius:20px;padding:10px 16px 12px;font-family:var(--hand);font-size:22px;line-height:26px;box-shadow:3px 4px 0 var(--red)}
.bubble b{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--green-2);font-weight:800;line-height:14px;margin-bottom:2px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25}
@media(prefers-reduced-motion:reduce){.pc.now .av,.pst.play{animation:none}.door .lid{transition:none}.door.today{animation:none}.lose .card{animation:none}}

<script>
window.ADVENT={
GAME:'advent-2026',START:'2026-12-01',HELP_HOUR:21,
PHRASE:'FROHEWEIHNACHTENALLESAMT',
/* Nur für den Testmodus ohne Server. Echte Spieler, Codes und E-Mails stehen privat im Google-Skript. */
DEMO:{lead:{code:'LEITUNGTEST',name:'Spielleitung'},players:[
 {id:'p1',name:'Anna',code:'TESTANNA',from:1},{id:'p2',name:'Ben',code:'TESTBEN',from:1},{id:'p3',name:'Clara',code:'TESTCLARA',from:1},
 {id:'p4',name:'David',code:'TESTDAVID',from:1},{id:'p5',name:'Eva',code:'TESTEVA',from:1}]},
PROLOG:[
 'In der Nacht zum ersten Dezember gab es am Nordpol einen Knall, den man bis nach Lappland hörte. Die Wunschzettel-Sortiermaschine, ein dampfendes Ungetüm aus Messing, Röhren und sehr viel gutem Willen, war heiß gelaufen. Erst flogen die Wunschzettel. Dann flog die Maschine. Und dann flog etwas, das niemals hätte fliegen dürfen.',
 'Über der Werkstatt des Weihnachtsmanns hing seit dreihundert Jahren der Polarstern, ein riesiger Stern aus Eisglas, der dem Schlitten in der Heiligen Nacht den Weg weist. Die Druckwelle hat ihn vom Turm geholt. Er ist in vierundzwanzig Splitter zersprungen, und jeder liegt jetzt irgendwo im Nordpoldorf.',
 'Frau Weihnachtsmann, die hier ehrlich gesagt den Laden schmeißt, hat noch in derselben Nacht die Wichtelpost losgeschickt. Gesucht: Aushilfswichtel mit klarem Kopf. Gefunden: euch.',
 '»Jeden Tag ein Splitter«, sagt sie und rückt ihre Brille zurecht. »In jeden ist ein Buchstabe eingraviert, die setzen wir am Ende zusammen. Und für jeden Splitter packen die Wichtel ein Geschenk auf den Schlitten. Wenn der Stern an Heiligabend nicht leuchtet, bleibt der Schlitten am Boden. Und dann«, sie senkt die Stimme, »muss Klaus die Geschenke mit dem Fahrrad ausliefern.«'],
CAST:[['Frau Weihnachtsmann','die eigentliche Chefin, Brille, Klemmbrett, keine Geduld für Ausreden'],['Klaus, der Weihnachtsmann','gutmütig, nervös, isst bei Stress Lebkuchen'],['Oberwichtel Pfefferkorn','grummelig, pünktlich, schreibt die Erinnerungen'],['Rudolph','Rentier mit roter Nase und 40.000 Followern'],['Die Wichtel','fleißig, laut, gewerkschaftlich organisiert']],
DAYS:[
 {t:'Der Knall am Nordpol',s:['Es ist der Morgen danach. In der Werkstatt liegt Konfetti aus Wunschzetteln, der Weihnachtsmann sitzt auf einem umgekippten Schaukelpferd und isst vor Aufregung seinen dritten Lebkuchen. Oberwichtel Pfefferkorn hat zwei Fotos der Werkstatt: eins von gestern, eins von heute früh.','»Irgendwo hier ist der erste Splitter gelandet«, brummt er. »Ich sehe ihn nicht. Ich sehe nur Chaos. Vergleicht die Bilder, dann wisst ihr, wo sich etwas verändert hat.« {name}, du fängst an.']},
 {t:'Frau Weihnachtsmanns Plätzchen',s:['Gegen die Nerven hilft nur eins, findet Frau Weihnachtsmann: backen. Die ganze Wichtelküche duftet nach Butter und Vanille. Nur das Rezeptbuch hat die Explosion nicht gut überstanden, die Seiten der Vanillekipferl liegen wild durcheinander.','»Bring das Rezept in Ordnung, {name}«, sagt sie und drückt dir einen Kochlöffel in die Hand. »Der Splitter steckt im Teig, das spüre ich. Aber nur, wenn wir alles in der richtigen Reihenfolge machen.«']},
 {t:'Der verschlüsselte Wunschzettel',s:['{prev} hat gestern einen Splitter aus dem Kipferlteig gezogen, mit Teig dran, aber glänzend. Heute flattert den Wichteln ein besonderer Wunschzettel vor die Füße. Ein Kind aus Bielefeld hat ihn in Geheimschrift geschrieben, weil, so steht es ganz unten, »meine Schwester alles liest«.','In den Zettel eingewickelt: ein Splitter. Aber der Weihnachtsmann besteht darauf, erst den Wunsch zu lesen. »Das gehört sich so.« {name}, die Chiffrierscheibe liegt bereit.']},
 {t:'Das Wichtel-Memory',s:['In der Wichtelkantine herrscht Mittagspause, und Mittagspause bedeutet bei den Wichteln: Memory. Pfefferkorn ist ungeschlagener Champion seit 1987 und lässt das jeden wissen.','»Wer gegen mich gewinnt, bekommt den Splitter, den ich heute früh in der Suppe gefunden habe«, sagt er. »Wer verliert, spült ab.« {name}, die Karten liegen verdeckt auf dem Tisch.']},
 {t:'Der Weg zum Rentierstall',s:['Über Nacht hat es einen halben Meter geschneit. Rudolph meldet über seinen Kanal, dass im Rentierstall »etwas Funkelndes« liegt, und fügt sieben Sternchen-Emojis hinzu. Der Weg dorthin führt über das große Schneefeld, und das ist tückisch: Jedes Feld trägt nur ein einziges Mal, danach bricht man ein.','Frau Weihnachtsmann hat eine Karte gezeichnet. »Jedes freie Feld genau einmal betreten, {name}. Nicht die Tannen, nicht den Brunnen. Und bitte keine Abkürzungen, die Wichtel haben letztes Jahr drei Stiefel verloren.«']},
 {t:'Nikolaus kommt zu Besuch',s:['Heute ist Nikolaustag, und der Nikolaus schaut wie jedes Jahr auf einen Tee vorbei. Er ist der ältere Cousin vom Weihnachtsmann und erzählt bei jeder Gelegenheit, dass er das mit den Geschenken schon gemacht hat, »als ihr noch in Windeln wart«.','Vor der Tür stehen drei Stiefel. In einem steckt ein Splitter, in den anderen Mandarinen. Der Nikolaus weiß, in welchem, aber er verrät es nur in Rätseln. »Das gehört zur Tradition«, sagt er und zwinkert. {name}, hör ihm gut zu.']},
 {t:'Das Glockenspiel im Turm',s:['{prev} hat gestern den richtigen Stiefel erwischt, die Mandarinen haben die Wichtel gegessen. Heute schlägt die Turmuhr der Werkstatt dreizehn, was sie noch nie getan hat. Im Glockenspiel klemmt etwas, und jedes Mal, wenn es spielt, blitzt oben zwischen den Glocken etwas Eisblaues auf.','»Das Glockenspiel gibt nur frei, was man ihm richtig nachspielt«, erklärt Pfefferkorn. »Hat der alte Glockenmeister so gebaut. Wir dachten immer, das sei ein Witz.« {name}, die Glocken warten.']},
 {t:'Der Rentier-Dienstplan',s:['Montagmorgen im Rentierstall. Der Dienstplan ist bei der Explosion verbrannt, und vier Rentiere streiten, wer heute welche Aufgabe hat. Rudolph will auf keinen Fall Schnee schippen, »wegen der Nase«.','Frau Weihnachtsmann hat die Aussagen der Rentiere aufgeschrieben. Wer den Plan richtig zusammensetzt, findet im Futtertrog den Splitter. {name}, ihr teilt euch die Notizen.']},
 {t:'Stau im Geschenkelager',s:['Im Geschenkelager stauen sich die Pakete. Die Förderbänder stehen still, und mittendrin klemmt ein kleines rotes Päckchen, in dem es leise klirrt.','»Die großen Kisten müssen zuerst weg«, ruft ein Wichtel vom Gabelstapler. »Aber die bewegen sich nur vor und zurück!« {name}, schaff dem roten Päckchen einen Weg zur Rampe.']},
 {t:'Das Polarlicht funkt',s:['In der Nacht tanzt das Polarlicht über dem Dorf, grün und violett. Aber es tanzt komisch: kurz, lang, kurz, Pause. Der alte Sternwärter schwört, das Polarlicht habe schon immer gefunkt, nur habe nie jemand hingesehen.','»Es will uns sagen, wo der nächste Splitter liegt«, flüstert Frau Weihnachtsmann. {name}, schreib mit.']},
 {t:'Die Lebkuchen-Rechnung',s:['Der Weihnachtsmann hat aus Nervosität so viele Lebkuchen gegessen, dass die Bäckerei eine Inventur macht. Die Zahlen auf dem Bestellzettel ergeben merkwürdige Muster, und unter dem letzten Blech liegt etwas Glänzendes.','»Erst die Rechnung, dann der Splitter«, sagt die Bäckermeisterin streng. {name}, du rechnest.']},
 {t:'Stromausfall in der Werkstatt',s:['Mitten am Nachmittag fällt in der Werkstatt der Strom aus. Die Wichtel haben die Lichterketten für den Weihnachtsbaum an dieselbe Steckdose wie den Glühweinkocher angeschlossen. Wieder einmal.','Im Dunkeln glitzert es irgendwo zwischen den Werkbänken. {name}, nimm die Taschenlampe.']},
 {t:'Die Christbaumkugeln',s:['Halbzeit am Nordpol. Zwölf Splitter, zwölf Geschenke. Der Weihnachtsmann hat zur Feier eine Christbaumkugel mit einem Bild bemalen lassen, aber beim Aufhängen ist sie zersprungen, und die Wichtel haben die Scherben falsch zusammengeklebt.','»In der Kugel ist der Splitter eingeschlossen«, sagt Pfefferkorn. »Bild zusammenschieben, dann geht sie auf.« {name}, ruhige Hände.']},
 {t:'Der vereiste Brief',s:['Am Fenster der Poststube klebt ein Brief, festgefroren in einer dicken Eisschicht. Man sieht nur, dass er in roter Tinte geschrieben ist und dass etwas darin funkelt.','»Nicht mit dem Föhn«, warnt Frau Weihnachtsmann. »Das gab letztes Jahr Ärger mit der Sicherung.« {name}, kratz das Eis weg.']},
 {t:'Die große Schneeballschlacht',s:['Die Wichtel haben Schneemänner gebaut, jeder mit einem Eimer als Hut. Unter einem der Eimer liegt der heutige Splitter, und die Wichtel geben ihn nur her, wenn alle Schneemänner fallen. Das ist Wichteltradition, behaupten sie. Das haben sie sich gerade ausgedacht.','{name}, die Schneebälle sind geformt.']},
 {t:'Die Kuckucksuhr',s:['In der Stube des Weihnachtsmanns hängt eine Kuckucksuhr, die genau anzeigt, wann der Schlitten an Heiligabend abheben muss. Bei der Explosion sind die Zeiger verrutscht.','»Wenn wir die falsche Zeit einstellen, fliegen wir zu spät los«, sagt der Weihnachtsmann und knabbert nervös an einem Lebkuchen. {name}, stell die Uhr richtig, dann kommt der Kuckuck mit dem Splitter heraus.']},
 {t:'Wichtelnamen-Salat',s:['Die Namensschilder an den Wichtelbetten sind durcheinandergeraten. Jedes Schild trägt die Buchstaben eines Namens, nur in falscher Reihenfolge. Die Wichtel weigern sich zu schlafen, bevor das geklärt ist.','Unter dem letzten Kopfkissen liegt der Splitter. {name}, sortier die Buchstaben.']},
 {t:'Das Geschenkpapier-Muster',s:['Die Geschenkpapierrollen kommen aus der Maschine mit Mustern, die immer weitergehen. Bis auf eine Rolle, die mittendrin abreißt. Der Splitter klebt am Ende dieser Rolle fest.','»Das Muster muss weitergehen, sonst geht die Maschine nicht auf«, sagt Pfefferkorn. {name}, du weißt, was zu tun ist.']},
 {t:'Der Glühweinkessel',s:['Für die Wichtelweihnachtsfeier braucht die Küche genau vier Liter Kinderpunsch. Leider gibt es nur einen Fünf-Liter-Kessel und einen Drei-Liter-Topf, beide ohne Markierung.','Im Boden des Kessels steckt der Splitter, und er löst sich erst, wenn die richtige Menge drin ist. {name}, schütt um.']},
 {t:'Spuren im Schnee',s:['Jemand hat einen Splitter aus dem Lager geholt und eine Spur aus Hufabdrücken hinterlassen. Rudolph beteuert seine Unschuld in einem langen Video. Die anderen Rentiere schweigen verdächtig.','Pfefferkorn hat von jedem Rentier einen Abdruck genommen. {name}, nimm die Lupe.']},
 {t:'Der Tresor des Weihnachtsmanns',s:['Im Büro steht der alte Tresor des Weihnachtsmanns. Darin liegt der Ersatzschlüssel für den Schlitten, und daneben, so hofft Frau Weihnachtsmann, der einundzwanzigste Splitter. Die Kombination hat der Weihnachtsmann natürlich vergessen.','»Es waren vier Zahlen«, stammelt er. »Irgendwas mit Rentieren und mit Lebkuchen.« {name}, die Antworten stecken in der Geschichte.']},
 {t:'Sternschnuppen',s:['In dieser Nacht regnet es Sternschnuppen über dem Nordpol, und zwischen ihnen fallen kleine, eisblaue Splittersplitter vom Himmel. Wer genug davon fängt, hat den zweiundzwanzigsten Splitter zusammen.','{name}, halt die Hände auf.']},
 {t:'Der Schlitten klemmt',s:['Der Schlitten steht seit dem Frühjahr in der Scheune, und die Kufen sind festgefroren. Ohne kräftiges Anschieben bewegt er sich keinen Zentimeter, und unter der rechten Kufe blitzt der vorletzte Splitter.','Die Rentiere schauen zu und kauen Heu. »Wir ziehen erst ab Heiligabend«, sagt Rudolph. »Steht so im Vertrag.« {name}, schieb an.']},
 {t:'Heiligabend',s:['Es ist der vierundzwanzigste Dezember. Dreiundzwanzig Splitter liegen auf dem Werktisch, und Frau Weihnachtsmann hält den letzten in der Hand. Er war die ganze Zeit in ihrer Schürzentasche. »Für den Schluss«, sagt sie, »habe ich ihn aufgehoben.«','Die Buchstaben auf den Splittern ergeben einen Satz. Wer ihn richtig zusammensetzt, bringt den Polarstern wieder zum Leuchten. Heute dürft ihr alle zusammen ran.']}
],
FINALE:[
 'Der letzte Buchstabe rastet ein, und für einen Moment ist es ganz still im Nordpoldorf. Dann beginnt der Polarstern zu glühen, erst schwach wie eine Kerze, dann hell wie ein Leuchtturm. Ein Lichtstrahl schießt in den Himmel, und das Polarlicht tanzt so wild, dass Rudolph vergisst, ein Video zu machen.',
 'Der Schlitten ist voll bis obenhin: vierundzwanzig Geschenke, eins für jeden Splitter. Die Rentiere scharren mit den Hufen, Klaus zieht die Mütze tief ins Gesicht, und Frau Weihnachtsmann reicht ihm eine Thermoskanne und einen letzten Lebkuchen. »Nicht alle auf einmal essen.«',
 'Kurz bevor der Schlitten abhebt, dreht sich der Weihnachtsmann noch einmal um. »Ohne euch säße ich jetzt auf dem Fahrrad«, sagt er. »Ganz unten auf dem Schlitten liegt für jeden von euch etwas. Von uns. Und von jemandem, der euch sehr gern hat.«',
 'Dann knallt die Peitsche, die Glocken klingen, und der Schlitten zieht eine goldene Spur über den Himmel, dem Polarstern nach. Frohe Weihnachten allesamt.'],
/* Rätsel: Typ und Inhalte. Tag 9 bis 23 folgen. */
R:[
 {type:'diff',title:'Vorher und nachher',how:'Oben die Werkstatt von gestern, unten von heute früh. Fünf Dinge haben sich verändert. Tipp sie im unteren Bild an.',tips:['Achte auf Farben: das Schaukelpferd, die Mütze, die Kugeln am Baum.','Zähle nach: die Geschenke unter dem Baum und die Sterne an der Wand.']},
 {type:'sort',title:'Das Kipferl-Rezept',how:'Bring die Schritte für Vanillekipferl in die richtige Reihenfolge.',items:['Mehl, gemahlene Mandeln, Zucker und kalte Butter verkneten','Den Teig in Folie gewickelt kalt stellen','Kleine Hörnchen formen und aufs Blech legen','Goldgelb backen','Noch warm in Vanillezucker wälzen'],tips:['Der Teig muss ruhen, bevor man ihn formt.','Der Vanillezucker kommt ganz zum Schluss, solange die Kipferl noch warm sind.']},
 {type:'cipher',title:'Die Geheimschrift',how:'Das Kind hat jeden Buchstaben um ein paar Stellen im Alphabet verschoben. Wie viele, steht am Rand: »So viele, wie der Weihnachtsmann Rentiere vor dem Schlitten hat, ohne Rudolph.« Dreh die Scheibe und tipp die Geheimbuchstaben an.',plain:'EIN HUND',key:8,answers:['EINHUND','EIN HUND'],tips:['Ohne Rudolph zieht der Weihnachtsmann acht Rentiere. Unter dem A muss ein I stehen.','Es sind zwei Wörter. Das zweite ist ein Tier, das bellt.']},
 {type:'memory',title:'Pfefferkorns Memory',how:'Finde alle acht Paare. Immer zwei Karten aufdecken.',icons:['🎄','⭐','🎁','🦌','⛄','🔔','🕯️','🍪'],tips:['Fang in einer Ecke an und decke Reihe für Reihe auf.','Merk dir jede Karte, bevor du eine neue aufdeckst.']},
 {type:'path',title:'Das Schneefeld',how:'Vom Haus unten links zum Rentierstall oben rechts. Jedes freie Feld genau einmal betreten, Tannen und Brunnen nicht. Tipp Feld für Feld, immer zum Nachbarfeld.',block:['1,2','2,4'],start:'4,0',goal:'0,4',tips:['Geh zuerst die ganze unterste Reihe entlang.','Die Ecke oben links muss dir unterwegs nicht im Weg stehen. Plane so, dass du dort nicht stecken bleibst.']},
 {type:'boots',title:'Drei Stiefel',how:'Auf jedem Stiefel klebt ein Zettel. Der Nikolaus verrät: Genau einer der drei Zettel sagt die Wahrheit. In welchem Stiefel steckt der Splitter?',boots:[['Roter Stiefel','Der Splitter ist in diesem Stiefel.'],['Grüner Stiefel','Der Splitter ist nicht in diesem Stiefel.'],['Goldener Stiefel','Der Splitter ist nicht im roten Stiefel.']],sol:1,tips:['Probier es aus: Nimm an, der Splitter wäre im roten Stiefel. Wie viele Zettel wären dann wahr?','Es dürfen nicht zwei Zettel gleichzeitig stimmen. Prüf den grünen Stiefel genau.']},
 {type:'simon',title:'Das Glockenspiel',how:'Die Glocken spielen dir eine Melodie vor. Spiel sie nach. Jede Runde kommt ein Ton dazu. Schaffst du sechs Töne?',len:6,tips:['Sag die Farben leise mit, das hilft beim Merken.','Mit »Noch mal vorspielen« hörst du die Melodie so oft du willst.']},
 {type:'grid',title:'Der Dienstplan',how:'Vier Rentiere, vier Aufgaben. Jeder deckt seine Notizen auf und liest vor. Tipp in die Tabelle: einmal für Nein, zweimal für Ja. In jeder Zeile und Spalte gibt es genau ein Ja.',rows:['Rudolph','Komet','Blitz','Donner'],cols:['Schnee schippen','Geschenke tragen','Kufen polieren','Navigation'],sol:[3,1,0,2],
   notes:[['Rudolph hat die Navigation, wegen der leuchtenden Nase.','Komet poliert keine Kufen, davon wird ihm schwindelig.'],['Blitz trägt keine Geschenke und poliert nichts.','Donner schippt keinen Schnee, er hat Rücken.']],tips:['Rudolph steht fest. Damit fällt die Navigation für alle anderen weg.','Blitz bleibt nur noch eine Aufgabe übrig, die nicht ausgeschlossen ist.']}
]};
</script>
<script>
(function(){
'use strict';
const A=window.ADVENT;const NDAYS=24;
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const norm=s=>String(s).toUpperCase().replace(/Ä/g,'AE').replace(/Ö/g,'OE').replace(/Ü/g,'UE').replace(/ß/g,'SS').replace(/[^A-Z0-9]/g,'');
const DPR=()=>Math.min(2,window.devicePixelRatio||1);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
const SS={get(k){try{return sessionStorage.getItem(k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}};
const app=$('#app');let cleanups=[];const cleanup=()=>{cleanups.forEach(f=>{try{f();}catch(e){}});cleanups=[];try{speechSynthesis.cancel();}catch(e){}};
const QS=new URLSearchParams(location.search);

/* ---------- Kalenderlogik ---------- */
function rawDay(){const s=new Date(A.START+'T00:00:00'),n=new Date();return Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-s)/864e5)+1;}
function dayNow(){const ov=QS.get('tag');if(ov&&(!API||ME_LEAD||QS.get('test')==='1'))return Math.max(0,Math.min(25,+ov));return Math.max(0,Math.min(25,rawDay()));}
const hourNow=()=>{const ov=QS.get('stunde');return ov!=null&&(!API||ME_LEAD||QS.get('test')==='1')?+ov:new Date().getHours();};
/* Reihum: Wer neu dazukommt, stellt sich hinten an. Vergangene Tage bleiben, wie sie waren. */
function assignments(players){const q=[],out={};for(let d=1;d<=NDAYS;d++){players.forEach(p=>{const f=Math.max(1,p.from||1);if(f===d)q.push(p.id);});
  let id=null;for(let k=0;k<q.length;k++){const c=q.shift();const pl=players.find(x=>x.id===c);if(pl&&(!pl.until||pl.until>=d)){id=c;q.push(c);break;}}out[d]=id;}return out;}
function reduce(st,ev){
  if(!st||ev.k==='reset')st={v:1,p:{},d:{},feed:[],fin:null};
  const t=ev.t||Date.now();if(!ev.p)return st;
  const p=st.p[ev.p]=st.p[ev.p]||{join:0,seen:0};
  const push=o=>{st.feed.push(Object.assign({t,p:ev.p},o));if(st.feed.length>60)st.feed=st.feed.slice(-60);};
