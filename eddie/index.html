<style>
/* Layout: Nextwing Nacht as a storybook. Sticky top bar with chapter progress, timer and collected letters; one chapter per screen: illustration, callback line, story, Eddie's thought, the riddle card, then who solved it and the reward. */
:root{--surface:#0b1220;--raised:#131c2e;--sunken:#070c18;--line:#25304a;--line-strong:#5b6a8a;--ink:#eef2fb;--muted:#98a3bd;--action:#ff6a1f;--action-hover:#ff8a4c;--action-soft:#3a1c0e;--on-action:#0b1220;--info:#8eacff;--info-soft:#15224a;--success:#5fd3a0;--success-soft:#0e2e20;--danger:#ff8a8a;--danger-soft:#3a1214;--warning:#f5c451;--warning-soft:#33280b;--paper:#f3ead8;--paper-ink:#3a2a18;
--display:"Outfit",ui-sans-serif,system-ui,sans-serif;--sans:"Manrope",ui-sans-serif,system-ui,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--surface:#f6f8fc;--raised:#fff;--sunken:#e6ecf6;--line:#d5ddeb;--line-strong:#7a879d;--ink:#0e1526;--muted:#535e73;--action:#c2410c;--action-hover:#9a3412;--action-soft:#ffe9dc;--on-action:#fff;--info:#2856b8;--info-soft:#e3ecff;--success:#137346;--success-soft:#ddf5e8;--danger:#bf2a2a;--danger-soft:#fce4e4;--warning:#7a5600;--warning-soft:#fdf1d2;color-scheme:light}}
:root[data-theme="light"]{--surface:#f6f8fc;--raised:#fff;--sunken:#e6ecf6;--line:#d5ddeb;--line-strong:#7a879d;--ink:#0e1526;--muted:#535e73;--action:#c2410c;--action-hover:#9a3412;--action-soft:#ffe9dc;--on-action:#fff;--info:#2856b8;--info-soft:#e3ecff;--success:#137346;--success-soft:#ddf5e8;--danger:#bf2a2a;--danger-soft:#fce4e4;--warning:#7a5600;--warning-soft:#fdf1d2;color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:26px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
a{color:var(--info)}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.topin{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--display);font-size:17px}
.brand svg{width:26px;height:26px}
.brand b{font-weight:700}
.prog{display:flex;gap:5px;align-items:center}
.prog i{width:18px;height:6px;border-radius:999px;background:var(--line)}

.prog i.now{background:var(--info)}
.meta{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lt{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;background:var(--action-soft);color:var(--action);font-family:var(--display);font-weight:700;font-size:13px}
.label{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(32px,7vw,46px);line-height:1.08;letter-spacing:-.02em;margin:6px 0 10px;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:clamp(26px,5.5vw,34px);line-height:1.12;letter-spacing:-.015em;margin:4px 0 0;text-wrap:balance}
.illu{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(170deg,#0a1430,#1b2a55 70%,#2b3d70);aspect-ratio:16/7;max-width:100%}
.illu svg{display:block;width:100%;height:100%}
.callback{margin:0;font-size:15px;line-height:24px;color:var(--info);background:var(--info-soft);border-radius:12px;padding:10px 14px}
.story{display:flex;flex-direction:column;gap:14px;font-size:17px;line-height:28px;max-width:62ch}
.story p{margin:0}
.story .letter{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:16px 18px;font-style:italic;box-shadow:0 1px 0 rgba(0,0,0,.2);line-height:27px}
.eddie{display:flex;gap:12px;align-items:flex-start}
.eddie svg{width:52px;height:52px;flex:none}
.bubble{position:relative;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:15px;line-height:23px}
.bubble b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--warning);font-weight:600;line-height:16px;margin-bottom:2px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;line-height:20px;white-space:nowrap}
.p-open{background:var(--action-soft);color:var(--action)}
.p-done{background:var(--success-soft);color:var(--success)}
.how{margin:0;font-size:14px;line-height:21px;color:var(--muted)}
.field{background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;touch-action:manipulation}
.answer{display:flex;gap:8px;flex-wrap:wrap}
.answer input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--sunken);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;min-height:46px}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;min-height:46px;cursor:pointer;border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--action);border-color:var(--action);color:var(--on-action)}
.btn.primary:hover{background:var(--action-hover);border-color:var(--action-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--info);padding-inline:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,.icon:focus-visible,.tile:focus-visible,.cell:focus-visible,.sortitem:focus-visible,.ltile:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--info)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stars{font-family:var(--mono);color:var(--warning);letter-spacing:2px}
.msg{margin:0;font-size:15px;line-height:23px;border-radius:10px;padding:10px 12px}
.msg.ok{background:var(--success-soft);color:var(--success)}
.msg.no{background:var(--danger-soft);color:var(--danger)}
.msg.tip{background:var(--info-soft);color:var(--info)}
.who{display:flex;flex-direction:column;gap:10px;background:var(--sunken);border:1px dashed var(--line-strong);border-radius:12px;padding:14px}
.who .row{display:flex;gap:8px;flex-wrap:wrap}
.reward{display:flex;gap:14px;align-items:center}
.bigl{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-size:34px;font-weight:700;background:var(--action-soft);color:var(--action);flex:none}
.next{align-self:flex-start}
.icon{font:inherit;width:44px;height:40px;border-radius:8px;border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);cursor:pointer;display:grid;place-items:center;font-size:18px}
.lock{display:flex;gap:10px;justify-content:center}
.wheel{display:flex;flex-direction:column;align-items:center;gap:6px}
.digit{width:56px;height:66px;border-radius:10px;background:linear-gradient(180deg,#2a2016,#4a3826 50%,#2a2016);color:#f3d9a8;display:grid;place-items:center;font-family:var(--mono);font-size:34px;border:1px solid #6b5236}
.verse{font-style:italic;text-align:center;line-height:26px;margin:0;color:var(--ink)}
.barks{min-height:28px;font-family:var(--display);font-weight:700;color:var(--warning);display:flex;gap:10px}
.barks span{animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.cipher{width:min(100%,300px);aspect-ratio:1;touch-action:none;user-select:none;cursor:grab}
.ctext{font-family:var(--mono);font-size:20px;letter-spacing:.2em;text-align:center;word-break:break-word}
.secret{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
@media(max-width:460px){.secret{grid-template-columns:1fr}}
.sc{border:1px solid var(--line-strong);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--raised)}
.sc p{margin:0;font-size:15px;line-height:22px}
.map{display:grid;grid-template-columns:28px repeat(4,1fr);gap:4px;width:min(100%,360px)}
.map .hd{display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.cell{aspect-ratio:1;max-width:100%;border-radius:8px;border:1px solid #6b5a3a;background:#d9c9a3;cursor:pointer;padding:0;display:grid;place-items:center}
.cell svg{width:72%;height:72%}
.cell.hit{background:#f2b77a;border-color:#ff6a1f}
.cell.dug{background:#bfae88}
.puzzle{display:grid;gap:3px;width:min(100%,300px);aspect-ratio:1;touch-action:none;user-select:none}
.tile{border:0;border-radius:4px;padding:0;background-repeat:no-repeat;cursor:pointer}
.tile.empty{background:transparent;cursor:default}
.sortlist{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:8px}
.sortitem{display:flex;align-items:flex-start;gap:10px;background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:10px 8px 10px 12px;touch-action:none;user-select:none;font-style:italic;font-size:15px;line-height:22px}
.sortitem.drag{box-shadow:0 8px 24px rgba(0,0,0,.4);position:relative;z-index:2;outline:2px solid var(--action)}
.sortitem.locked{outline:2px solid var(--success)}
.sortitem .t{flex:1}
.sortitem .btns{display:flex;flex-direction:column;gap:4px}
.sortitem .icon{width:36px;height:32px;background:#e6d9bd;color:var(--paper-ink);border-color:#b39c72;font-size:15px}
.ltiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ltile{width:52px;height:60px;border-radius:10px;font-family:var(--display);font-size:28px;font-weight:700;border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);cursor:pointer}
.ltile.used{opacity:.25}
.slots{display:flex;gap:8px;justify-content:center}
.slot{width:52px;height:60px;border-radius:10px;border:2px dashed var(--line-strong);display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:700;color:var(--action)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--sunken);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--mono);font-size:24px;font-weight:500;line-height:30px}
.stat span{font-size:13px;color:var(--muted)}
.start{display:flex;flex-direction:column;gap:16px}
.cast{display:flex;gap:14px;flex-wrap:wrap}
.cast div{display:flex;align-items:center;gap:8px;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;font-weight:600}
.cast span.av{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#0b1220}
.tools{display:flex;gap:6px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){.barks span{animation:none}}
</style>

<script>
(function(){
'use strict';
const K='Kathleen',S='Stefan';
const CH=[
{ title:'Die Blechdose', illu:'box',
  story:[
   'Es war einer dieser Abende, an denen der Herbst schon nach Kamin roch. Kathleen hatte gerade Tee aufgesetzt, Stefan suchte seit zehn Minuten die Fernbedienung, und Eddie lag im Flur und tat das, was er am besten konnte: so aussehen, als hätte er seit Tagen nichts gegessen.',
   'Dann hörten sie es. Ein Kratzen. Ein Scharren. Und schließlich ein triumphierendes Bellen aus dem Garten. Eddie war, irgendwann zwischen Tee und Fernbedienung, durch die Terrassentür verschwunden.',
   'Als Stefan nach draußen ging, saß Eddie mitten im Beet, über und über mit Erde bedeckt. Vor ihm lag etwas, das ganz eindeutig nicht dorthin gehörte: eine verbeulte Blechdose, rostig, mit einem kleinen Zahlenschloss aus Messing. Eddie sah Stefan an, als wollte er sagen: Ich habe meinen Teil erledigt. Der Rest ist euer Problem.',
   'Am Küchentisch drehten sie die Dose hin und her. Sie war schwerer, als sie aussah. Auf dem Deckel war ein kleines Haus eingraviert, und darunter standen drei Zeilen in einer altmodischen, geschwungenen Schrift.'],
  eddie:'Ich habe euch etwas gefunden. Dafür erwarte ich mindestens eine Scheibe Käse.',
  riddle:{type:'lock',title:'Das Zahlenschloss',how:'Drei Ziffern. Die Lösung steht auf dem Deckel, und Eddie kann helfen.',code:[8,5,3],
   tips:['Auf dem Deckel ist ein Haus eingraviert. Zählt alle Fenster, auch die im Dach.','Gefunden hat die Dose Eddie. Zählt die Buchstaben seines Namens. Und tippt auf Eddie, wenn ihr wissen wollt, wie oft er ruft.']},
  reward:'Mit einem rostigen Knirschen sprang das Schloss auf. In der Dose lag, eingewickelt in ein Wachstuch, ein vergilbter Briefumschlag. Darauf stand, in derselben geschwungenen Schrift: »An die Finderin, an den Finder. Bitte mit Geduld öffnen.« Darunter, sorgfältig umrandet, ein einzelner Buchstabe.',
  letter:'N', after:'Ein Brief. Man kann ihn nicht essen. Ich bin enttäuscht, aber gefasst.',
  cb:{K:'Kathleen hatte das Schloss geknackt, noch bevor Stefan »Lass mich mal« sagen konnte.',S:'Stefan hatte das Schloss geknackt und erwähnte das in den folgenden zehn Minuten nur viermal.',B:'Gemeinsam hatten sie das Schloss geknackt. Eddie beanspruchte den Ruhm trotzdem für sich, schließlich hatte er die Dose ausgegraben.'}},

{ title:'Der Brief von Agathe', illu:'letter',
  story:[
   'Der Umschlag knisterte, als Kathleen ihn öffnete. Darin lag ein eng beschriebener Brief, datiert auf den 3. Oktober 1963.',
   {letter:'Liebe Finderin, lieber Finder,<br>wenn Ihr diesen Brief lest, dann hat ein neugieriger Hund meine Dose gefunden. Das freut mich. Ich habe immer gehofft, dass es ein Hund sein würde.<br><br>Mein Name ist Agathe Hagedorn. Ich habe in diesem Haus gewohnt, lange bevor Ihr kamt. Ich habe hier etwas versteckt, das mir sehr viel bedeutet hat. Ich verrate Euch nicht, was es ist. Aber ich verrate Euch, wo Ihr anfangen müsst. Der nächste Ort steht unten, verschlüsselt, denn ein Schatz, den man einfach findet, ist keiner.'},
   'Darunter stand eine Reihe merkwürdiger Buchstaben. Und ganz am Rand, mit Bleistift ergänzt: »Den Schlüssel trägt der Finder in seinem Namen.«',
   'Stefan zog noch etwas aus der Dose: zwei übereinanderliegende Ringe aus Pappe, mit Buchstaben beschriftet, die man gegeneinander drehen konnte. Eine Chiffrierscheibe. Agathe hatte wirklich an alles gedacht.'],
  eddie:'Der Finder bin ich. Nur damit das hier allen klar ist.',
  riddle:{type:'cipher',title:'Die Chiffrierscheibe',how:'Dreht die innere Scheibe. Außen steht der Klartext, innen die Geheimschrift. Wie weit ihr drehen müsst, steckt im Namen des Finders.',plain:'ALTE EICHE',key:5,
   tips:['Der Finder heißt Eddie, das sind fünf Buchstaben. Dreht, bis innen unter dem A ein F steht.','Es sind zwei Wörter. Das zweite ist ein Baum.']},
  reward:'»Alte Eiche«, las Stefan laut. Kathleen sah aus dem Fenster. Am Ende des Gartens, hinter dem Komposthaufen, stand eine Eiche, so knorrig, dass sie schon immer da gewesen sein musste. Auf der Rückseite des Briefes klebte ein kleiner Zettel mit einem weiteren Buchstaben.',
  letter:'U', after:'Endlich geht es raus. Draußen riecht es nach Igel.',
  cb:{K:'Kathleen hatte die Botschaft entschlüsselt, während Stefan die Scheibe noch verkehrt herum hielt.',S:'Stefan hatte die Botschaft entschlüsselt und sich dabei wie ein Geheimagent gefühlt. Er summte sogar die Melodie.',B:'Zu zweit hatten sie die Scheibe gedreht, bis der Text Sinn ergab. Eddie hatte währenddessen ein Nickerchen gemacht, das er als Beratung verbuchte.'}},

{ title:'Unter der alten Eiche', illu:'oak',
  story:[
   'Draußen war es inzwischen dunkel. Stefan hielt die Taschenlampe, Kathleen den Brief, und Eddie lief voraus, die Nase am Boden, als hätte er sein Leben lang nichts anderes getan.',
   'In einem Astknoten der Eiche steckte ein zusammengerolltes Stück Papier. Eine Karte, von Hand gezeichnet. Sie zeigte einen Garten, eingeteilt in Felder, mit Bäumen, einem Brunnen, einer Bank und einem großen Stein. Ein Garten, wie er vor sechzig Jahren ausgesehen haben musste.',
   'Aber die Karte war in der Mitte durchgerissen, und auf jeder Hälfte stand ein Satz. Kathleen nahm die eine Hälfte, Stefan die andere. Agathe hatte das offenbar genau so geplant: Wer hier weiterkommen will, muss miteinander reden.'],
  eddie:'Ich könnte auch einfach überall buddeln. Nur so als Vorschlag.',
  riddle:{type:'map',title:'Die zerrissene Karte',how:'Jeder deckt nur seine eigene Kartenhälfte auf und liest sie dem anderen vor. Dann tippt ihr gemeinsam auf das richtige Feld.',
   tips:['Der Brunnen steht in Reihe 2.','Schaut euch Spalte B an: Dort steht kein einziger Baum.']},
  reward:'Kaum hatten sie das Feld markiert, war Eddie schon da. Er grub mit einer Hingabe, die er sonst nur dem Sofa widmete. Nach ein paar Sekunden stieß seine Pfote auf etwas Hartes: eine flache Steinplatte, bedeckt mit festgebackener Erde. In einer Ecke war ein Buchstabe eingeritzt.',
  letter:'F', after:'Habt ihr gesehen, wie schnell ich war? Ich möchte, dass das im Protokoll steht.',
  cb:{K:'Kathleen hatte auf der Karte das richtige Feld gefunden. Stefan behauptete später, er habe es auch gewusst, nur leiser.',S:'Stefan hatte auf der Karte das richtige Feld gefunden und dafür zum ersten Mal an diesem Abend Eddies uneingeschränkten Respekt bekommen.',B:'Mit beiden Kartenhälften zusammen war es plötzlich ganz einfach gewesen. Agathe hätte sich gefreut.'}},

{ title:'Die Steinplatte', illu:'stone',
  story:[
   'Die Platte war schwer und kalt, und die Erde klebte daran, als wollte sie das Geheimnis nicht hergeben. In der Mitte war etwas eingeritzt, ein einzelnes Wort, aber man musste es erst freilegen.',
   'Kathleen kniete sich ins feuchte Gras. Stefan leuchtete. Eddie schnaufte ungeduldig in beide Nacken gleichzeitig, was technisch eigentlich nicht möglich sein sollte.'],
  eddie:'Für mich riecht das alles nach Wurm. Aber bitte, macht ihr mal.',
  riddle:{type:'scratch',title:'Unter der Erde',how:'Wischt die Erde mit dem Finger oder der Maus weg. Dann lest, was dasteht. Agathe hatte eine Vorliebe für Umwege.',word:'MRUTHCRIK',answers:['kirchturm'],
   tips:['Lest das Wort von hinten nach vorn.','Es ist der höchste Teil einer Kirche.']},
  reward:'»Kirchturm«, sagte Stefan. Sie sahen sich an. Vom Garten aus konnte man ihn sehen, den alten Kirchturm am Ende der Straße, dessen Uhr seit Jahren auf zehn nach zwölf stehen geblieben war. Unter dem Wort, kaum noch zu erkennen, war ein weiterer Buchstabe eingeritzt.',
  letter:'D', after:'Ein Spaziergang. Um diese Uhrzeit. Ich bin dabei.',
  cb:{K:'Kathleen hatte das Wort auf der Steinplatte als Erste gelesen. Rückwärts. Im Dunkeln. Stefan war beeindruckt und versuchte, es sich nicht anmerken zu lassen.',S:'Stefan hatte das Wort auf der Steinplatte entziffert, indem er den Kopf so lange schief hielt, bis es Sinn ergab.',B:'Gemeinsam hatten sie die Erde von der Platte gewischt. Ihre Hände sahen danach aus wie Eddies Pfoten.'}},

{ title:'Moritz', illu:'tower',

function bark(n,onEach){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();
  for(let i=0;i<n;i++)setTimeout(()=>{onEach&&onEach(i);if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(170,t+.16);f.type='bandpass';f.frequency.value=900;f.Q.value=1.2;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(f);f.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.22);},i*480);}

  f.innerHTML=`<div class="slots" id="slots"></div><div class="ltiles" id="lt"></div>`;
  const S=f.querySelector('#slots'),L=f.querySelector('#lt');
  const render=()=>{S.innerHTML='';for(let k=0;k<6;k++){const b=el('button','slot ltile',pick[k]!=null?found[pick[k]]:'');b.type='button';b.setAttribute('aria-label',pick[k]!=null?'Feld '+(k+1)+': '+found[pick[k]]+', antippen zum Entfernen':'Feld '+(k+1)+' leer');b.style.cssText='border-style:'+(pick[k]!=null?'solid':'dashed');b.addEventListener('click',()=>{if(pick[k]!=null){pick.splice(k,1);render();}});S.appendChild(b);}
    L.innerHTML='';found.forEach((ch,k)=>{const b=el('button','ltile'+(pick.includes(k)?' used':''),ch);b.type='button';b.disabled=pick.includes(k);b.setAttribute('aria-label','Buchstabe '+ch);b.addEventListener('click',()=>{if(pick.length<6&&!pick.includes(k)){pick.push(k);render();if(pick.length===6)check();}});L.appendChild(b);});};
  const check=()=>{const w=pick.map(k=>found[k]).join('');if(w===R.word)setTimeout(api.solved,400);else{api.wrong('Das Schloss bleibt zu. Eddie seufzt hörbar.');setTimeout(()=>{pick.length=0;render();},900);}};
  render();
}};

if(G.ch<0||!G.start)renderStart();else renderCh(G.ch);
})();
</script>
