<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ferdinands Wintervorrat</title>
<meta name="description" content="Ein Herbst-Rätselspiel für fünf am großen Fernseher. Etwa 20 Minuten.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout für den Fernseher: jede Szene füllt genau einen Bildschirm, nichts scrollt. Große Schrift in rem, skaliert mit der Bildschirmbreite. Herbstwald im Abendlicht mit fallendem Laub im Hintergrund; vorne eine Holztafel für Geschichte und Rätsel. Nur dunkel-warm: Herbstabend. */
:root{--bg:#1d120c;--ink:#fff3e0;--muted:#e7c9a6;--orange:#ff8a1e;--rust:#c2410c;--ochre:#f2b23a;--wine:#8a2a2a;--olive:#6b7a2a;--leaf:#e85d2a;--wood:#5a3a22;--wood2:#3a2416;--cream:#fff3dc;--p-ink:#2a1a10;--action:#ff6a1f;--on-action:#1d120c;--info:#8eacff;
--fun:"Fredoka",ui-rounded,system-ui,sans-serif;--hand:"Caveat","Segoe Print",cursive;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{font-size:clamp(15px,1.25vw,30px);background:var(--bg)}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;color:var(--ink);font-family:var(--fun);font-size:1.1rem;line-height:1.4;
 background:radial-gradient(120vw 70vh at 50% 110%,#6b2a10 0%,transparent 60%),radial-gradient(60vw 40vh at 80% 0%,#f2b23a33,transparent 70%),linear-gradient(180deg,#2a160c,#1d120c 60%,#120a06)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:.6rem 1.2rem;pointer-events:none}
.top > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:.4rem;color:var(--ink);text-decoration:none;font-size:.8rem;opacity:.75}
.brand svg{width:1.4rem;height:1.4rem}
.tools{display:flex;gap:.5rem}
.tb{font:inherit;font-size:.9rem;min-width:2.4rem;height:2.4rem;border-radius:.6rem;border:2px solid #ffffff33;background:#00000055;color:var(--ink);cursor:pointer}
.nuts{display:flex;gap:.35rem;position:fixed;top:.7rem;left:50%;transform:translateX(-50%);z-index:5}
.nut{width:2.2rem;height:2.6rem;display:grid;place-items:center;font-weight:700;font-size:1.1rem;color:var(--p-ink);border-radius:50% 50% 45% 45%/40% 40% 60% 60%;background:#ffffff18;border:2px dashed #ffffff40}
.nut.got{background:radial-gradient(circle at 35% 30%,#e8a45a,#9a5a22 70%);border:0;box-shadow:inset 0 -.25rem 0 #00000040;color:#fff3dc;text-shadow:0 2px 0 #0006}
main{position:relative;z-index:2;height:100%;display:grid;place-items:center;padding:3.6rem 1.6rem 1.4rem;overflow:hidden}
.scene{width:min(100%,62rem);display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center;animation:in .6s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(1.5rem) scale(.98)}to{opacity:1;transform:none}}
h1{margin:0;font-weight:700;font-size:4.2rem;line-height:1;color:var(--ochre);text-shadow:0 .25rem 0 var(--wine),0 .6rem 1.4rem #000a}
h2{margin:0;font-weight:700;font-size:2.6rem;line-height:1.05;color:var(--ochre);text-shadow:0 .18rem 0 var(--wine)}
.sub{margin:0;font-size:1.3rem;color:var(--muted)}
.board{position:relative;width:100%;border-radius:1.2rem;padding:1.4rem 1.8rem;background:repeating-linear-gradient(92deg,#ffffff00 0 1.4rem,#ffffff08 1.4rem 1.5rem,#00000010 1.5rem 2.8rem),linear-gradient(180deg,var(--wood),var(--wood2));box-shadow:inset 0 0 0 .3rem #00000030,0 1.2rem 2.4rem #0009;text-align:left}
.board p{margin:0 0 .6rem;font-size:1.35rem;line-height:1.45}
.board p:last-child{margin-bottom:0}
.btn{font:inherit;font-weight:700;font-size:1.3rem;border-radius:1rem;padding:.7rem 1.6rem;min-height:3.2rem;cursor:pointer;border:0;background:var(--action);color:var(--on-action);box-shadow:0 .3rem 0 #a33c08;display:inline-flex;align-items:center;gap:.5rem}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#ffffff1a;color:var(--ink);box-shadow:none;border:2px solid #ffffff40}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.tb:focus-visible,.opt:focus-visible,.pump:focus-visible,.leafc:focus-visible,.tree:focus-visible,.tile:focus-visible,.dial button:focus-visible{outline:none;box-shadow:0 0 0 .2rem var(--bg),0 0 0 .4rem var(--info)}
.row{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;align-items:center}
.kbd{font-size:.85rem;color:var(--muted);opacity:.8}
.cast{display:flex;gap:1.2rem;flex-wrap:wrap;justify-content:center}
.pl{display:flex;flex-direction:column;align-items:center;gap:.3rem;font-weight:600;font-size:1.2rem}
.pl svg{width:5rem;height:5rem;filter:drop-shadow(0 .3rem .4rem #0008)}
.pl.done{opacity:.55}
.pl.now svg{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.4rem) rotate(-4deg)}}
.turn{font-size:6rem;font-weight:700;line-height:1;color:var(--cream);text-shadow:0 .3rem 0 var(--rust),0 0 2rem #ff8a1e88}
.turn small{display:block;font-size:1.6rem;color:var(--muted);text-shadow:none;margin-bottom:.4rem}
.say{font-family:var(--hand);font-size:2rem;line-height:1.15;color:var(--ochre);margin:0}
.hud{display:flex;gap:2rem;justify-content:center;font-size:1.5rem;font-weight:700}
.msg{margin:0;font-size:1.3rem;font-weight:600;border-radius:.8rem;padding:.5rem 1.2rem}
.msg.ok{background:#d9f5e6;color:#0f4d2e}.msg.no{background:#ffe0e4;color:#8e1426}.msg.tip{background:var(--cream);color:var(--p-ink)}
/* Quiz */
.q{font-size:2rem;font-weight:600;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1rem;width:100%}
.opt{font:inherit;font-size:1.5rem;font-weight:600;text-align:left;border-radius:1rem;border:3px solid #ffffff30;background:#ffffff14;color:var(--ink);padding:1rem 1.2rem;cursor:pointer;display:flex;gap:.8rem;align-items:center;min-height:5rem}
.opt b{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--ochre);color:var(--p-ink);flex:none}
.opt.no{background:#8a2a2a;border-color:#ff8080;animation:shake .4s}
.opt.ok{background:#2f6b45;border-color:#8fe0b4}
@keyframes shake{25%{transform:translateX(-.6rem)}75%{transform:translateX(.6rem)}}
/* Hütchenspiel */
.shell{position:relative;width:100%;max-width:50rem;height:20rem}
.pump{position:absolute;bottom:2rem;width:12rem;height:11rem;margin-left:-6rem;border:0;background:transparent;cursor:pointer;padding:0;transition:left .45s cubic-bezier(.5,0,.5,1),transform .35s}
.pump svg{width:100%;height:100%}
.pump.lift{transform:translateY(-6rem)}
.nutb{position:absolute;bottom:2.4rem;width:3rem;height:3.4rem;margin-left:-1.5rem;transition:left .2s}
/* Apfel und Zählbild */
canvas.play{width:min(100%,56rem,calc((100vh - 18rem)*2));aspect-ratio:16/8;border-radius:1rem;background:#2a1a10;touch-action:none;cursor:none;box-shadow:0 1rem 2rem #0008}
.count{width:min(100%,52rem,calc((100vh - 22rem)*2.1));border-radius:1rem;box-shadow:0 1rem 2rem #0008}
.count svg{display:block;width:100%;height:auto;border-radius:1rem}
.dials{display:flex;gap:1.4rem;justify-content:center}
.dial{display:flex;flex-direction:column;align-items:center;gap:.3rem}
.dial span{font-size:3.4rem;font-weight:700;width:5rem;height:5.6rem;display:grid;place-items:center;border-radius:.8rem;background:var(--cream);color:var(--p-ink);box-shadow:inset 0 -.3rem 0 #0003}
.dial i{font-style:normal;font-size:1rem;color:var(--muted)}
.dial button{font:inherit;font-size:1.4rem;width:4rem;height:2.6rem;border-radius:.6rem;border:0;background:var(--ochre);color:var(--p-ink);cursor:pointer;font-weight:700}
/* Blätter */
.leaves{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;width:100%}
.leafc{border:3px solid transparent;border-radius:1rem;background:#ffffff12;padding:.6rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.3rem;color:var(--ink);font:inherit;font-size:1.1rem}
.leafc svg{width:7rem;height:7rem}
.leafc.sel{border-color:var(--ochre);background:#f2b23a26}
.leafc.ok{border-color:#8fe0b4;background:#2f6b4566}
.trees{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;width:100%}
.tree{font:inherit;font-size:1.5rem;font-weight:700;border-radius:1rem;border:3px dashed #ffffff50;background:transparent;color:var(--ink);padding:.9rem;cursor:pointer;min-height:4.4rem}
.tree.ok{border-style:solid;border-color:#8fe0b4;background:#2f6b4566}
/* Finale */
.tiles,.slots{display:flex;gap:.8rem;justify-content:center}
.tile,.slot{width:5.6rem;height:6.6rem;border-radius:50% 50% 45% 45%/40% 40% 60% 60%;display:grid;place-items:center;font-size:3.2rem;font-weight:700;border:0}
.tile{background:radial-gradient(circle at 35% 30%,#e8a45a,#9a5a22 70%);color:#fff3dc;text-shadow:0 3px 0 #0006;cursor:pointer;box-shadow:inset 0 -.35rem 0 #00000040,0 .4rem .8rem #0007}
.tile.used{opacity:.2}
.slot{background:#ffffff14;border:3px dashed #ffffff50;color:#fff3dc}
.slot.f{background:radial-gradient(circle at 35% 30%,#e8a45a,#9a5a22 70%);border:0}
.big-nut{width:12rem;height:14rem}
.stats{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
.stats .pl small{font-size:1rem;color:var(--muted);font-weight:500}
.crown{font-size:2.4rem}
@media(max-width:700px){html{font-size:13px}h1{font-size:3rem}.turn{font-size:4rem}.opts,.leaves,.trees{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){.scene,.pl.now svg{animation:none}.pump{transition:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header class="top"><a class="brand" href="../" aria-label="Nextwing Quest"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0b1220"/><path d="M12 22 C24 14 40 13 52 17 C42 19 30 22 20 28 Z" fill="#4d7cff"/><path d="M12 33 C24 25 40 24 52 28 C42 30 30 33 20 39 Z" fill="#ff6a1f"/><path d="M12 44 C24 36 40 35 52 39 C42 41 30 44 20 50 Z" fill="#8eacff"/></svg>nextwing quest</a>
<div class="tools"><button class="tb" id="fs" type="button" aria-label="Vollbild">⛶</button><button class="tb" id="snd" type="button" aria-label="Ton ausschalten">🔊</button></div></header>
<div class="nuts" id="nuts" aria-label="Gesammelte Nüsse"></div>
<main id="app"></main>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const PL=[{n:'Hannelore',c:'#e85d2a',l:'H'},{n:'Miri',c:'#c2185b',l:'E'},{n:'Marcus',c:'#6b7a2a',l:'R'},{n:'Stefan',c:'#2b6cb0',l:'B'},{n:'Kathleen',c:'#b7791f',l:'S'}];
const WORD='HERBST';
const STORY={
 intro:['Im Wald hinterm Haus wohnt Ferdinand, das vergesslichste Eichhörnchen von ganz Westfalen. Jeden Herbst versteckt er seinen Wintervorrat, und jeden Herbst schreibt er sich auf, wo.','Letzte Nacht hat der Herbststurm seine Zettel verweht. Fünf Verstecke, fünf Nüsse mit je einem Buchstaben, und ohne das Codewort bleibt seine Vorratskammer zu. Ferdinand hat Hilfe geholt: euch fünf.'],
 turns:['Ferdinand flitzt auf Hannelores Schulter. »Du kennst dich aus mit dem Herbst. Mein erster Zettel ist ein Quiz, das hab ich mir selbst geschrieben. Wahrscheinlich.«','»Miri, du hast scharfe Augen«, sagt Ferdinand. »Ich hab eine Nuss unter einem Kürbis versteckt und dann vor lauter Aufregung die Kürbisse durcheinandergeschoben. Mehrmals.«','»Marcus! Der alte Apfelbaum schüttelt gleich seine Äpfel ab, und unter den guten liegt meine dritte Nuss. Fang die guten, lass die wurmigen fallen.«','»Stefan, mein Schuppen hat ein Zahlenschloss. Der Code ist ganz einfach: wie viele Kürbisse, Äpfel und Pilze auf meinem Herbstbild sind. Zählen war nie meine Stärke.«','»Kathleen, der Wind hat meine Blättersammlung durcheinandergewirbelt. Ordne jedes Blatt seinem Baum zu, dann rückt der Wind die letzte Nuss heraus.«'],
 rewards:['Vier von vier! Unter dem letzten Quizzettel klebt eine Nuss.','Gefunden! Ferdinand macht vor Freude einen Salto und fällt vom Kürbis.','Volle Kiste! Zwischen den Äpfeln kullert eine Nuss hervor.','Klick! Das Schloss springt auf. Im Schuppen liegt eine Nuss auf einem Rechen.','Alle Blätter sitzen. Der Wind seufzt und lässt eine Nuss fallen.'],
 final:'Fünf Nüsse, fünf Buchstaben. »Den letzten Buchstaben kenne ich selbst«, sagt Ferdinand stolz und legt ein T dazu. »Den vergesse ich nie. Glaube ich.« Jetzt setzt das Codewort zusammen.',
 end:['Die Tür der Vorratskammer knarrt auf: 312 Haselnüsse, 48 Bucheckern, 17 Walnüsse und ein Gummibärchen, von dem Ferdinand nicht weiß, wie es dahin kam.','»Ihr habt meinen Winter gerettet«, sagt er und verteilt an jeden von euch eine Nuss. »Die schönste behaltet ihr. Und wenn ihr nächsten Herbst wieder Zeit habt: Ich werde garantiert wieder etwas vergessen.«']
};
const KEY='herbst-ferdinand-v1';
let G;try{G=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){G=null;}
const fresh=()=>({step:'title',i:0,start:0,t:{},tips:{}});if(!G)G=fresh();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(G));}catch(e){}};
const app=$('#app');let cleanups=[];const cleanup=()=>{cleanups.forEach(f=>{try{f();}catch(e){}});cleanups=[];try{speechSynthesis.cancel();}catch(e){}};
const DPR=()=>Math.min(2,devicePixelRatio||1);

/* ---------- Ton ---------- */
let AC=null,MUTE=false;try{MUTE=localStorage.getItem('herbst-mute')==='1';}catch(e){}
const ac=()=>{if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC.state==='suspended')AC.resume();return AC;};
let MASTER=null;const out=()=>{const a=ac();if(!a)return null;if(!MASTER){MASTER=a.createGain();MASTER.gain.value=MUTE?0:1;MASTER.connect(a.destination);}return MASTER;};
let NB=null;const nb=a=>{if(!NB){NB=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return NB;};
function noise({dur=.2,type='bandpass',f=1000,f2=null,q=1,vol=.3,at=0,att=.005,dest=null}){const a=ac(),o=dest||out();if(!a||!o)return;const t=a.currentTime+at,s=a.createBufferSource();s.buffer=nb(a);const fl=a.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(g);g.connect(o);s.start(t,Math.random()*1.5);s.stop(t+dur+.05);}
function tone({f=440,f2=null,dur=.3,type='sine',vol=.2,at=0,att=.005,dest=null}){const a=ac(),o=dest||out();if(!a||!o)return;const t=a.currentTime+at,s=a.createOscillator();s.type=type;s.frequency.setValueAtTime(f,t);if(f2)s.frequency.exponentialRampToValueAtTime(f2,t+dur);const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(g);g.connect(o);s.start(t);s.stop(t+dur+.05);}
const mf=m=>440*Math.pow(2,(m-69)/12);
const pluck=(f,at,v=.1,dest)=>{tone({f,dur:1.2,type:'triangle',vol:v,at,dest});tone({f:f*2,dur:.35,vol:v*.35,at,dest});};
const SFX={
 rustle(){noise({dur:.5,f:3200,f2:1400,q:.5,vol:.18,att:.08});noise({dur:.3,f:5000,q:.6,vol:.08,at:.15});},
 thud(){tone({f:150,f2:70,dur:.18,vol:.4});noise({dur:.08,type:'lowpass',f:800,vol:.25});},
 knock(){tone({f:220,f2:140,dur:.15,type:'triangle',vol:.35});tone({f:180,f2:110,dur:.15,type:'triangle',vol:.3,at:.12});},
 swoosh(){noise({dur:.3,f:700,f2:2200,q:1,vol:.12,att:.05});},
 chirp(){[0,.12,.24].forEach(at=>tone({f:2600,f2:3800,dur:.08,vol:.08,at}));},
 good(){[659,880,1047].forEach((f,k)=>pluck(f,k*.09,.1));},
 bad(){tone({f:300,f2:180,dur:.35,type:'triangle',vol:.18});},
 click(){noise({dur:.03,f:3000,q:5,vol:.22});},
 tick(){noise({dur:.02,f:4000,q:8,vol:.2});},
 win(){[[57,0],[60,.15],[64,.3],[69,.45],[64,.7],[69,.85],[72,1.1]].forEach(([m,t])=>pluck(mf(m+12),t,.12));SFX.chirp();},
 fanfare(){[[60,0],[64,.2],[67,.4],[72,.6],[67,.95],[72,1.15],[76,1.5]].forEach(([m,t])=>{pluck(mf(m+12),t,.14);pluck(mf(m),t,.08);});noise({dur:1.6,f:3000,f2:1200,q:.4,vol:.12,at:.3,att:.4});},
 turn(){noise({dur:.7,f:2400,f2:800,q:.5,vol:.18,att:.15});pluck(mf(69),.2,.1);pluck(mf(76),.35,.1);}
};
const sfx=n=>{if(MUTE)return;try{SFX[n]&&SFX[n]();}catch(e){}};
const TUNE=[[69,1],[72,.5],[76,1],[74,.5],[72,1],[71,.5],[69,1.5],[64,1],[67,.5],[69,1],[71,.5],[72,1],[71,.5],[69,1.5]];
let AMB=null;
function ambient(on){const a=ac(),o=out();if(!a||!o)return;
  if(on&&!AMB){const bus=a.createGain();bus.connect(o);const s=a.createBufferSource();s.buffer=nb(a);s.loop=true;const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=.4;const g=a.createGain();g.gain.value=.03;s.connect(bp);bp.connect(g);g.connect(bus);s.start();
    const gust=setInterval(()=>{const v=.015+Math.random()*.06;g.gain.setTargetAtTime(v,a.currentTime,1.6);bp.frequency.setTargetAtTime(300+Math.random()*700,a.currentTime,2);if(Math.random()<.35)noise({dur:.6,f:3000+Math.random()*2000,q:.5,vol:.04,att:.2,dest:bus});},2500);
    const play=()=>{let t=0;TUNE.forEach(([m,d])=>{pluck(mf(m),t,.045,bus);if(d>=1)pluck(mf(m-12),t,.025,bus);t+=d*.5;});};const t0=setTimeout(play,1500);const mel=setInterval(play,24000);
    AMB={s,gust,mel,t0,bus};}
  else if(!on&&AMB){try{AMB.s.stop();}catch(e){}clearInterval(AMB.gust);clearInterval(AMB.mel);clearTimeout(AMB.t0);try{AMB.bus.disconnect();}catch(e){}AMB=null;}}
function setMute(m){MUTE=m;try{localStorage.setItem('herbst-mute',m?'1':'0');}catch(e){}if(MASTER)MASTER.gain.value=m?0:1;$('#snd').textContent=m?'🔇':'🔊';$('#snd').setAttribute('aria-label',m?'Ton einschalten':'Ton ausschalten');}
$('#snd').onclick=()=>{setMute(!MUTE);if(!MUTE)ambient(true);};setMute(MUTE);
$('#fs').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(e){}};

/* ---------- Hintergrund: Wald und fallendes Laub ---------- */
(function(){const cv=$('#bg'),x=cv.getContext('2d');let W,H,L=[];const red=matchMedia('(prefers-reduced-motion: reduce)').matches;const C=['#e85d2a','#f2b23a','#c2410c','#8a2a2a','#d9822b','#b7791f'];
  const rs=()=>{const d=DPR();W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);L=Array.from({length:Math.round(W/38)},()=>({x:Math.random()*W,y:Math.random()*H,s:6+Math.random()*12,v:.4+Math.random()*1,r:Math.random()*6,vr:(Math.random()-.5)*.04,c:C[Math.floor(Math.random()*C.length)],p:Math.random()*6}));};rs();addEventListener('resize',rs);
  const trees=Array.from({length:14},(_,i)=>({x:i/13,h:.35+((i*37)%10)/40,w:.05+((i*13)%5)/100}));
  const leaf=(l)=>{x.save();x.translate(l.x,l.y);x.rotate(l.r);x.fillStyle=l.c;x.beginPath();x.moveTo(0,-l.s);x.quadraticCurveTo(l.s*.8,-l.s*.2,0,l.s);x.quadraticCurveTo(-l.s*.8,-l.s*.2,0,-l.s);x.fill();x.strokeStyle='#0003';x.lineWidth=1;x.beginPath();x.moveTo(0,-l.s);x.lineTo(0,l.s);x.stroke();x.restore();};
  const draw=t=>{x.clearRect(0,0,W,H);x.fillStyle='#ffd27a';x.globalAlpha=.25;x.beginPath();x.arc(W*.8,H*.18,H*.09,0,7);x.fill();x.globalAlpha=1;

   ${P.map(([x,y,s])=>pumpkin(x,y,s)).join('')}${Ap.map(([x,y])=>apple(x,y)).join('')}${S.map(([x,y])=>shroom(x,y)).join('')}</svg>`;
  const v=[0,0,0];
  const el=shell(i,'Ferdinands Schuppenschloss','Zählt zusammen: Wie viele Kürbisse, Äpfel und Pilze sind auf dem Bild? Stellt die drei Zahlen ein.',`<div class="count">${svg}</div><div class="dials">${['Kürbisse','Äpfel','Pilze'].map((n,k)=>`<div class="dial"><button data-k="${k}" data-d="1" aria-label="${n} plus">▲</button><span id="d${k}">0</span><button data-k="${k}" data-d="-1" aria-label="${n} minus">▼</button><i>${n}</i></div>`).join('')}</div><div class="row"><button class="btn" id="ck">Schloss öffnen</button></div>`);
  tipper(el,i,['Die Kastanien und Blätter zählen nicht mit, nur Kürbisse, Äpfel und Pilze.','Auf den beiden Tischen liegen auch Äpfel. Und hinten auf der Wiese versteckt sich ein Kürbis.']);
  el.querySelectorAll('.dial button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;v[k]=(v[k]+ +b.dataset.d+10)%10;el.querySelector('#d'+k).textContent=v[k];sfx('tick');});
  el.querySelector('#ck').onclick=()=>{if(v.every((n,k)=>n===CODE[k])){sfx('good');setTimeout(()=>done(i),500);}else{const ok=v.filter((n,k)=>n===CODE[k]).length;sfx('bad');say(el,`Das Schloss klemmt. ${ok} von 3 Zahlen stimmen.`,'no');}};}
function leaves(i){const L=[['Ahorn','M50 96 L50 74 M50 74 L36 79 L39 68 L20 72 L25 61 L8 54 L19 48 L10 33 L27 37 L29 24 L40 33 L42 13 L50 22 L58 13 L60 33 L71 24 L73 37 L90 33 L81 48 L92 54 L75 61 L80 72 L61 68 L64 79 Z','#e85d2a'],
   ['Eiche','M50 6 C60 8 56 20 64 22 C74 24 70 36 66 40 C76 44 74 56 66 58 C72 66 64 76 56 74 C56 82 52 88 50 94 C48 88 44 82 44 74 C36 76 28 66 34 58 C26 56 24 44 34 40 C30 36 26 24 36 22 C44 20 40 8 50 6 Z','#b7791f'],
   ['Kastanie','M50 90 L50 56 M50 56 C44 40 40 16 50 4 C60 16 56 40 50 56 M50 56 C36 46 16 34 12 18 C30 18 44 38 50 56 M50 56 C64 46 84 34 88 18 C70 18 56 38 50 56 M50 56 C40 58 20 62 10 54 C22 46 40 50 50 56 M50 56 C60 58 80 62 90 54 C78 46 60 50 50 56','#c2410c'],
   ['Birke','M50 90 L50 70 M50 70 C30 62 26 40 34 26 C40 16 46 10 50 6 C54 10 60 16 66 26 C74 40 70 62 50 70 Z','#f2b23a']];
  const order=[2,0,3,1];let sel=-1,got=new Set();
  const el=shell(i,'Blättersalat','Klickt ein Blatt an und dann den passenden Baum. Vier Blätter, vier Bäume.',`<div class="leaves">${order.map(k=>`<button class="leafc" data-k="${k}" aria-label="Blatt ${k+1}"><svg viewBox="0 0 100 100"><path d="${L[k][1]}" fill="${L[k][2]}" stroke="#5a2a08" stroke-width="2" stroke-linejoin="round"/></svg><span>?</span></button>`).join('')}</div><div class="trees">${L.map((t,k)=>`<button class="tree" data-t="${k}">${t[0]}</button>`).join('')}</div>`);
  tipper(el,i,['Das Ahornblatt kennt ihr von der kanadischen Flagge.','Das Kastanienblatt besteht aus mehreren Fingern, das Birkenblatt ist klein und spitz.']);
  el.querySelectorAll('.leafc').forEach(b=>b.onclick=()=>{if(got.has(+b.dataset.k))return;sel=+b.dataset.k;el.querySelectorAll('.leafc').forEach(x=>x.classList.toggle('sel',x===b));sfx('rustle');});
  el.querySelectorAll('.tree').forEach(b=>b.onclick=()=>{if(sel<0){say(el,'Erst ein Blatt anklicken.','tip');return;}const t=+b.dataset.t;if(t===sel){got.add(sel);const lf=el.querySelector(`.leafc[data-k="${sel}"]`);lf.classList.remove('sel');lf.classList.add('ok');lf.querySelector('span').textContent=L[sel][0];b.classList.add('ok');sfx('good');sel=-1;if(got.size===4)setTimeout(()=>done(i),700);}else{sfx('bad');say(el,'Der Baum schüttelt den Kopf. Versucht einen anderen.','no');}});}

/* ---------- Finale und Ende ---------- */
function finale(){const tiles=WORD.split('').map((c,k)=>({c,k})).sort(()=>Math.random()-.5);let seq=[];
  const el=scene(`${SQ}<h2>Die Vorratskammer</h2><p class="say">${STORY.final}</p><div class="slots" id="sl">${WORD.split('').map(()=>'<span class="slot"></span>').join('')}</div><div class="tiles" id="tl">${tiles.map((t,k)=>`<button class="tile" data-k="${k}">${t.c}</button>`).join('')}</div><p class="msg" id="rm" hidden></p><div class="row"><button class="btn ghost" id="cl">Zurücksetzen</button></div>`);
  const sl=[...el.querySelectorAll('.slot')];const paint=()=>{sl.forEach((s,k)=>{s.textContent=seq[k]!=null?tiles[seq[k]].c:'';s.classList.toggle('f',seq[k]!=null);});el.querySelectorAll('.tile').forEach(b=>b.classList.toggle('used',seq.includes(+b.dataset.k)));};
  el.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(seq.includes(k))return;seq.push(k);sfx('knock');paint();if(seq.length===6){if(seq.map(j=>tiles[j].c).join('')===WORD){G.t.end=Date.now();setTimeout(()=>go('end'),500);}else{sfx('bad');say(el,'Die Tür bleibt zu. Welche Jahreszeit ist gerade?','no');setTimeout(()=>{seq=[];paint();},1100);}}});
  el.querySelector('#cl').onclick=()=>{seq=[];paint();};}
function ending(){sfx('fanfare');const secs=PL.map((p,k)=>Math.max(1,Math.round(((G.t['e'+k]||0)-(G.t['s'+k]||0))/1000)));const best=secs.indexOf(Math.min(...secs));const total=Math.round(((G.t.end||Date.now())-G.start)/60000);
  const fmt=s=>s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' Min.':s+' Sek.';
  const el=scene(`${SQ}<h1 style="font-size:3.4rem">Der Winter ist gerettet!</h1><div class="board">${STORY.end.map(p=>`<p>${p}</p>`).join('')}</div><div class="stats">${PL.map((p,k)=>`<div class="pl">${k===best?'<span class="crown">👑</span>':''}${av(p)}${p.n}<small>${fmt(secs[k])}${G.tips[k]?' · '+G.tips[k]+' Tipp'+(G.tips[k]>1?'s':''):''}</small></div>`).join('')}</div><p class="say">${PL[best].n} war am schnellsten und trägt die Herbstkrone ${new Date().getFullYear()}. Gesamtzeit: ${total} Minuten.</p><div class="row"><button class="btn ghost" id="r">Nochmal spielen</button></div>`);
  el.querySelector('#r').onclick=()=>{G=fresh();save();render();};}
render();
})();
</script>
