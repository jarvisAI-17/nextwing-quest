<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Expedition Polarstern · Spielerseite</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Nextwing Nacht, phone first. Brand bar, demo banner, greeting, today card with the riddle, own doors, received messages, letters; lead view swaps in a player table. */
:root{--surface:#0b1220;--raised:#131c2e;--sunken:#070c18;--line:#25304a;--line-strong:#5b6a8a;--ink:#eef2fb;--muted:#98a3bd;--action:#ff6a1f;--action-hover:#ff8a4c;--action-soft:#3a1c0e;--on-action:#0b1220;--info:#8eacff;--info-soft:#15224a;--success:#5fd3a0;--success-soft:#0e2e20;--danger:#ff8a8a;--danger-soft:#3a1214;--warning:#f5c451;--warning-soft:#33280b;
--display:"Outfit",ui-sans-serif,system-ui,sans-serif;--sans:"Manrope",ui-sans-serif,system-ui,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--surface:#f6f8fc;--raised:#fff;--sunken:#e6ecf6;--line:#d5ddeb;--line-strong:#7a879d;--ink:#0e1526;--muted:#535e73;--action:#c2410c;--action-hover:#9a3412;--action-soft:#ffe9dc;--on-action:#fff;--info:#2856b8;--info-soft:#e3ecff;--success:#137346;--success-soft:#ddf5e8;--danger:#bf2a2a;--danger-soft:#fce4e4;--warning:#7a5600;--warning-soft:#fdf1d2;color-scheme:light}}
:root[data-theme="light"]{--surface:#f6f8fc;--raised:#fff;--sunken:#e6ecf6;--line:#d5ddeb;--line-strong:#7a879d;--ink:#0e1526;--muted:#535e73;--action:#c2410c;--action-hover:#9a3412;--action-soft:#ffe9dc;--on-action:#fff;--info:#2856b8;--info-soft:#e3ecff;--success:#137346;--success-soft:#ddf5e8;--danger:#bf2a2a;--danger-soft:#fce4e4;--warning:#7a5600;--warning-soft:#fdf1d2;color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:23px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) 40px}
a{color:var(--info)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
#view{display:flex;flex-direction:column;gap:20px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{width:30px;height:30px}
.word{font-family:var(--display);font-size:20px}
.word b{font-weight:700}
.label{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.demo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--info-soft);color:var(--info);border-radius:12px;padding:8px 12px;font-size:13px;line-height:19px}
.demo button{font:inherit;font-weight:700;color:var(--info);background:transparent;border:1px solid currentColor;border-radius:8px;padding:4px 10px;cursor:pointer}
h1{font-family:var(--display);font-size:clamp(28px,6vw,36px);line-height:1.1;font-weight:600;margin:4px 0 6px;letter-spacing:-.015em}
.sub{margin:0;color:var(--muted)}
.card{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.today{border-color:color-mix(in srgb,var(--action) 55%,var(--line))}
.card h2{font-family:var(--display);font-size:20px;line-height:26px;margin:0;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;line-height:20px;white-space:nowrap}
.p-open{background:var(--action-soft);color:var(--action)}
.p-done{background:var(--success-soft);color:var(--success)}
.p-lock{background:var(--sunken);color:var(--muted)}
.p-info{background:var(--info-soft);color:var(--info)}
.field{background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.task{margin:0;width:100%;font-size:14px}
.answer{display:flex;gap:8px;flex-wrap:wrap}
.answer input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--sunken);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;min-height:44px}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer;border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--action);border-color:var(--action);color:var(--on-action)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,a:focus-visible,.demo button:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--info)}
.msg{margin:0;font-size:14px;line-height:21px;border-radius:10px;padding:10px 12px}
.msg.ok{background:var(--success-soft);color:var(--success)}
.msg.no{background:var(--danger-soft);color:var(--danger)}
.msg.tip{background:var(--info-soft);color:var(--info)}
.reward{display:flex;gap:14px;align-items:center;background:var(--sunken);border:1px solid var(--line);border-radius:12px;padding:14px}
.letter{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:30px;font-weight:700;background:var(--action-soft);color:var(--action);flex:none}
.quote{font-size:15px;line-height:23px;margin:0}
.doors{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.doors li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.doors li:first-child{border-top:0}
.doors .n{font-family:var(--mono);color:var(--muted);margin-right:10px}
.letters{display:flex;flex-wrap:wrap;gap:6px}
.slot{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:700;border:1px dashed var(--line-strong);color:transparent}
.slot.got{border:1px solid color-mix(in srgb,var(--action) 50%,transparent);background:var(--action-soft);color:var(--action)}
.stars{font-family:var(--mono);color:var(--warning);letter-spacing:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;border-top:0}
td.mono{font-family:var(--mono)}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600}
.error{text-align:center;padding:40px 0;display:flex;flex-direction:column;gap:12px;align-items:center}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="bar">
    <a class="brand" href="./"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0b1220"/><path d="M12 22 C24 14 40 13 52 17 C42 19 30 22 20 28 Z" fill="#4d7cff"/><path d="M12 33 C24 25 40 24 52 28 C42 30 30 33 20 39 Z" fill="#ff6a1f"/><path d="M12 44 C24 36 40 35 52 39 C42 41 30 44 20 50 Z" fill="#8eacff"/></svg><span class="word">next<b>wing</b></span></a>
    <span class="label">Expedition Polarstern</span>
  </header>
  <div id="view"></div>
</div>
<script src="codes.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]/g,'');
const PEOPLE=['Anna','Ben','Clara','David','Elif','Frank','Greta','Hannes'];
const DEMO_CODES=['K7F3-9QXA','M4PX-2RTB','C9WD-6HJN','D2KQ-8VMS','E5RT-3ZPL','F8NB-4XCW','G3HM-7QKD','H6LV-5TRY'];
const ORDER=[0,3,5,1,6,2,7,4, 2,6,0,4,1,7,3,5, 5,1,7,3,0,4,6,2];
const PHRASE='GEMEINSAMSINDWIRDERSTERN',PERM=[17,3,9,21,0,12,6,19,14,2,23,8,11,4,16,1,20,7,13,22,5,10,18,15];
const TODAY=11;
const MSG={1:'Beispiel: Anna, du warst die Erste, die beim Hüttenwochenende den Weg im Nebel gefunden hat. Jetzt führst du die Expedition an.',4:'Beispiel: Ben, niemand erzählt den Witz mit dem Rentier so schlecht wie du. Wir wollen ihn trotzdem jedes Jahr hören.'};
const KEY='quest-demo-';
const st=k=>{try{return JSON.parse(localStorage.getItem(KEY+k)||'{}');}catch(e){return {};}};
const save=(k,v)=>{try{localStorage.setItem(KEY+k,JSON.stringify(v));}catch(e){}};
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;d.setAttribute('role','status');document.body.appendChild(d);setTimeout(()=>d.remove(),2200);};
const doorState=(d,solved)=>d<TODAY||solved.includes(d)?'done':d===TODAY?'today':'locked';

const raw=location.hash.slice(1).toUpperCase().replace(/[^A-Z0-9]/g,'');
const entry=window.QUEST_CODES&&QUEST_CODES[raw];
const view=$('#view');
if(!entry){view.innerHTML=`<div class="error"><h1>Code nicht gefunden</h1><p class="sub">Öffne den Link aus deiner Einladung oder gib deinen Spielcode auf der Startseite ein.</p><a class="btn primary" href="./">Zur Startseite</a></div>`;return;}

const banner=`<div class="demo"><span><strong>Demo:</strong> Heute ist hier der ${TODAY}. Dezember. Namen und Texte sind Beispiele.</span><button type="button" id="reset">Demo zurücksetzen</button></div>`;
function bindReset(){const b=$('#reset');if(b)b.addEventListener('click',()=>{try{Object.keys(localStorage).filter(k=>k.startsWith(KEY)).forEach(k=>localStorage.removeItem(k));}catch(e){}location.reload();});}

if(entry.role==='lead'){renderLead();}else{renderPlayer(entry.player);}

function renderPlayer(pi){
  const name=PEOPLE[pi],S=st(raw);S.solved=S.solved||[];
  const mine=ORDER.map((o,i)=>o===pi?i+1:0).filter(Boolean);
  const todayMine=ORDER[TODAY-1]===pi;
  const solvedAll=new Set([...Array(TODAY-1).keys()].map(i=>i+1).concat(S.solved));
  view.innerHTML=banner+`
  <section><span class="label">Spielerseite</span><h1>Hallo ${esc(name)}</h1><p class="sub">${todayMine?'Heute führst du die Expedition an.':'Heute ist '+esc(PEOPLE[ORDER[TODAY-1]])+' dran. Helfen ist erlaubt.'}</p></section>
  <section class="card today" id="todayCard"></section>
  <section class="card"><div class="top"><h2>Deine Türen</h2><span class="label">je 3 pro Person</span></div><ul class="doors" id="doors"></ul></section>
  <section class="card" id="msgs"><h2>Deine Botschaften</h2><div id="msgList"></div></section>
  <section class="card"><div class="top"><h2>Gesammelte Buchstaben</h2><a href="polarstern/status.html">Statusseite</a></div><div class="letters" id="letters"></div><p class="sub" style="font-size:13px">Am 24. bringt ihr sie gemeinsam in die richtige Reihenfolge.</p></section>`;
  bindReset();
  const tc=$('#todayCard');
  if(todayMine){renderRiddle(tc,S,name);}
  else{tc.innerHTML=`<div class="top"><span class="label">Heute · Tür ${TODAY}</span><span class="pill p-info">${esc(PEOPLE[ORDER[TODAY-1]])} ist dran</span></div><h2>Du hast heute frei</h2><p class="sub">Deine nächste Tür ist die ${mine.find(d=>d>TODAY)||'–'}. Bis dahin kannst du den anderen helfen. Manche Rätsel gehen nur gemeinsam.</p>`;}
  const ul=$('#doors');ul.innerHTML=mine.map(d=>{const s=doorState(d,S.solved);return `<li><span><span class="n">Tür ${String(d).padStart(2,'0')}</span>${d<TODAY?'gelöst am '+(d+ (d===1?0:0))+'.12.':d===TODAY?(S.solved.includes(d)?'heute gelöst':'heute offen'):'öffnet am '+d+'.12.'}</span><span class="pill ${s==='done'||S.solved.includes(d)?'p-done':s==='today'?'p-open':'p-lock'}">${s==='done'||S.solved.includes(d)?'gelöst':s==='today'?'heute':'noch zu'}</span></li>`;}).join('');
  const msgs=mine.filter(d=>d<TODAY||S.solved.includes(d));
  $('#msgList').innerHTML=msgs.length?msgs.map(d=>`<div class="reward" style="margin-top:8px"><div class="letter">${PHRASE[PERM[d-1]]}</div><p class="quote"><span class="label">Tür ${d}</span><br>${esc(d===TODAY?S.msg||'':MSG[d]||'Beispiel: Hier steht die persönliche Botschaft der Gruppe an dich.')}</p></div>`).join(''):'<p class="sub">Noch keine. Deine erste Botschaft gibt es mit deiner ersten gelösten Tür.</p>';
  $('#letters').innerHTML=[...Array(24).keys()].map(i=>{const g=solvedAll.has(i+1);return `<span class="slot${g?' got':''}" aria-label="Tür ${i+1}${g?': '+PHRASE[PERM[i]]:' fehlt'}">${g?PHRASE[PERM[i]]:'?'}</span>`;}).join('');
}

function renderRiddle(tc,S,name){
  const done=S.solved.includes(TODAY);const tips=S.tips||0;
  tc.innerHTML=`<div class="top"><span class="label">Heute · Tür ${TODAY} · Mittel</span><span class="pill ${done?'p-done':'p-open'}">${done?'gelöst':'Rätsel offen'}</span></div>
  <h2>Unter dem Schnee</h2><p class="sub">Rubbel die Schneeschicht frei. Das Wort darunter steht verkehrt herum da.</p>
  <div class="field" id="rf"></div>
  <form class="answer" id="af"${done?' hidden':''}><input id="ans" autocomplete="off" placeholder="Das Wort" aria-label="Antwort"><button class="btn primary" type="submit">Prüfen</button></form>
  <p class="msg" id="rm" hidden aria-live="polite"></p>
  <div class="top"><span class="stars" id="stars"></span><button class="btn" type="button" id="tipB">Tipp</button></div>
  <div id="rw"></div>`;
  const TIPS=['Lies das Wort von hinten nach vorn.','Es beginnt mit L und leuchtet neben der Haustür.'];
  const say=(t,k)=>{const m=$('#rm');m.textContent=t;m.className='msg '+k;m.hidden=false;};
  const upd=()=>{const s=Math.max(1,3-(S.tips||0));$('#stars').textContent='★'.repeat(s)+'☆'.repeat(3-s);const b=$('#tipB');b.textContent=`Tipp (${Math.min(S.tips||0,2)}/2)`;b.disabled=done||(S.tips||0)>=2;};
  upd();
  $('#tipB').addEventListener('click',()=>{S.tips=(S.tips||0)+1;save(raw,S);upd();say(TIPS[S.tips-1],'tip');});
  scratch($('#rf'),'ENRETAL',done);
  const reward=()=>{$('#rw').innerHTML=`<div class="reward"><div class="letter">${PHRASE[PERM[TODAY-1]]}</div><p class="quote"><span class="label">Dein Buchstabe und deine Botschaft</span><br>${esc(S.msg)}</p></div>`;};
  if(done){reward();say('Gelöst: LATERNE. Die Gruppe sieht jetzt, dass Tür '+TODAY+' erledigt ist.','ok');}
  $('#af').addEventListener('submit',e=>{e.preventDefault();const v=norm($('#ans').value);if(!v){say('Gib zuerst eine Antwort ein.','no');return;}
    if(v==='laterne'){S.solved=[...S.solved,TODAY];S.msg='Beispiel: '+name+', du bringst Licht in jede Runde. Die Laterne von heute brauchen wir noch, kurz vor dem Ziel.';save(raw,S);
      toast('Richtig: LATERNE. Tür '+TODAY+' ist gelöst.');renderPlayer(entry.player);}
    else say('Leider nicht. Versuch es noch einmal oder hol dir einen Tipp.','no');});
}

function scratch(field,word,open){
  const wrap=document.createElement('div');wrap.style.cssText='position:relative;touch-action:none';field.appendChild(wrap);
  const w=Math.max(220,Math.min(420,(field.clientWidth||340)-26)),h=140,d=Math.min(2,devicePixelRatio||1);
  const base=document.createElement('canvas'),top=document.createElement('canvas');top.style.cssText='position:absolute;inset:0;touch-action:none;cursor:crosshair';top.setAttribute('aria-label','Schneeschicht zum Freirubbeln');
  [base,top].forEach(c=>{c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px';wrap.appendChild(c);});
  const b=base.getContext('2d');b.setTransform(d,0,0,d,0,0);b.fillStyle='#2a1d10';b.fillRect(0,0,w,h);b.fillStyle='#ff8a4c';b.font=`700 ${Math.min(50,w/8)}px JetBrains Mono, monospace`;b.textAlign='center';b.textBaseline='middle';b.fillText(word,w/2,h/2+3);
  if(open){top.remove();return;}
  const t=top.getContext('2d');t.setTransform(d,0,0,d,0,0);const g=t.createLinearGradient(0,0,0,h);g.addColorStop(0,'#f4f8ff');g.addColorStop(1,'#cbd6ec');t.fillStyle=g;t.fillRect(0,0,w,h);
  for(let i=0;i<240;i++){t.fillStyle=i%3?'rgba(255,255,255,.8)':'rgba(150,170,210,.35)';t.beginPath();t.arc(Math.random()*w,Math.random()*h,Math.random()*2.4+.4,0,7);t.fill();}
  t.fillStyle='rgba(80,100,150,.55)';t.font='600 14px Manrope, sans-serif';t.textAlign='center';t.fillText('hier rubbeln',w/2,h/2+5);
  t.globalCompositeOperation='destination-out';t.lineCap='round';t.lineWidth=34;let dn=false,lx=0,ly=0;
  const p=e=>{const r=top.getBoundingClientRect();return [(e.clientX-r.left)*w/r.width,(e.clientY-r.top)*h/r.height];};
  top.addEventListener('pointerdown',e=>{dn=true;top.setPointerCapture(e.pointerId);[lx,ly]=p(e);t.beginPath();t.arc(lx,ly,17,0,7);t.fill();});
  top.addEventListener('pointermove',e=>{if(!dn)return;const [a,c]=p(e);t.beginPath();t.moveTo(lx,ly);t.lineTo(a,c);t.stroke();lx=a;ly=c;});
  ['pointerup','pointercancel'].forEach(ev=>top.addEventListener(ev,()=>{dn=false;}));
}

function renderLead(){
  view.innerHTML=banner+`
  <section><span class="label">Spielleitung</span><h1>Expedition Polarstern</h1><p class="sub">Überblick über alle Spieler, Codes und Türen. Diese Ansicht sehen nur Leute mit dem Code der Spielleitung.</p></section>
  <section class="card"><div class="top"><h2>Heute · Tür ${TODAY}</h2><span class="pill p-open">${PEOPLE[ORDER[TODAY-1]]} ist dran · offen</span></div><p class="sub">${TODAY-1} von 24 Türen gelöst, keine Lücke. Erinnerung um 8:00 Uhr verschickt.</p></section>
  <section class="card"><div class="top"><h2>Spieler</h2><span class="label">8 Personen</span></div><div class="scroll"><table><thead><tr><th>Name</th><th>Code</th><th>Türen</th><th>Gelöst</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></section>
  <section class="card"><h2>Werkzeuge</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" data-t="Erinnerung an Hannes vorgemerkt (Demo).">Erinnerung senden</button><button class="btn" type="button" data-t="Tausch-Dialog folgt im echten Spiel (Demo).">Tage tauschen</button><button class="btn" type="button" data-t="Rundmail-Entwurf folgt im echten Spiel (Demo).">Rundmail schreiben</button><a class="btn" href="polarstern/status.html">Statusseite</a></div></section>`;
  bindReset();
  $('#tb').innerHTML=PEOPLE.map((n,i)=>{const ds=ORDER.map((o,k)=>o===i?k+1:0).filter(Boolean);const s=ds.filter(d=>d<TODAY).length;return `<tr><td>${n}</td><td class="mono">${DEMO_CODES[i]}</td><td class="mono">${ds.join(', ')}</td><td>${s} / 3</td><td><button class="btn" style="min-height:32px;padding:4px 10px" type="button" data-t="Neuer Code für ${n} würde ausgestellt (Demo).">Neuer Code</button></td></tr>`;}).join('');
  document.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>toast(b.dataset.t)));
}
})();
</script>
</body>
</html>
